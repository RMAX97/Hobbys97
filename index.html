:root{
  --teal:#008080;--face:#c0c0c0;--light:#dfdfdf;--white:#fff;--shadow:#808080;--dark:#0a0a0a;
  --navy:#000080;--blue:#1084d0;--text:#000;
  --raised:inset -1px -1px var(--dark),inset 1px 1px var(--white),inset -2px -2px var(--shadow),inset 2px 2px var(--light);
  --sunken:inset -1px -1px var(--white),inset 1px 1px var(--shadow),inset -2px -2px var(--light),inset 2px 2px var(--dark);
  --pressed:inset -1px -1px var(--white),inset 1px 1px var(--dark),inset -2px -2px var(--light),inset 2px 2px var(--shadow);
  --tb:30px;
  font-family:'W98',Tahoma,"MS Sans Serif","Microsoft Sans Serif",Geneva,Arial,sans-serif;font-size:12px;
  -webkit-font-smoothing:none;
}
*{box-sizing:border-box}
html{touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:var(--teal);color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img,canvas{image-rendering:pixelated}
img{-webkit-user-drag:none}
button{font:inherit;color:inherit}
:focus-visible{outline:1px dotted #000;outline-offset:-4px}

/* ---------- Bureau ---------- */
#desktop{position:fixed;inset:0 0 calc(var(--tb) + env(safe-area-inset-bottom,0px)) 0;padding:calc(6px + env(safe-area-inset-top,0px)) 4px 4px calc(4px + env(safe-area-inset-left,0px))}
.icons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,76px);grid-auto-columns:78px;height:100%;gap:0}
.dicon{display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;padding:2px 0;border:0;background:none;cursor:var(--cur)}
.dicon img{width:32px;height:32px}
.dicon span{color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.75);padding:1px 2px;line-height:1.25;text-align:center;border:1px dotted transparent}
.dicon.sel img{filter:brightness(.55) sepia(1) hue-rotate(190deg) saturate(6)}
.dicon.sel span{text-shadow:none;background:var(--navy);border-color:#ff0}
.dicon:focus-visible{outline:none}
.dicon:focus-visible span{border-color:#fff}

/* ---------- Fenêtres ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--face);box-shadow:var(--raised);padding:3px;min-width:240px;min-height:160px}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--tb) - env(safe-area-inset-bottom,0px))!important}
.win[hidden]{display:none}
.tbar{display:flex;align-items:center;gap:2px;height:19px;padding:0 2px 0 3px;background:linear-gradient(90deg,var(--shadow),#b5b5b5);color:var(--light);font-weight:bold;cursor:var(--cur);touch-action:none;flex:none}
.win.active .tbar{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff}
.tbar img{width:16px;height:16px}
.tbar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:16px;height:14px;padding:0;border:0;background:var(--face);box-shadow:var(--raised);display:grid;place-items:center;flex:none;margin-left:-1px}
.tbtn+.tbtn{margin-left:0}
.tbtn svg{width:8px;height:7px}
.tbtn:active{box-shadow:var(--pressed)}
.tbtn svg{display:block}
.tbtn.x{margin-left:1px}
.tbar b{margin-right:4px}
.menubar{display:flex;gap:0;padding:2px 0;flex:none}
.menubar span{padding:1px 6px}
.menubar u{text-decoration:underline}
.wbody{position:relative;flex:1;box-shadow:var(--sunken);padding:2px;background:#fff;min-height:0}
.wbody iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.wbody .loading{position:absolute;inset:2px;display:grid;place-items:center;color:var(--shadow);pointer-events:none}

/* ---------- Barre des tâches ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tb) + env(safe-area-inset-bottom,0px));padding:4px 2px env(safe-area-inset-bottom,0px) calc(2px + env(safe-area-inset-left,0px));display:flex;align-items:flex-start;gap:4px;background:var(--face);box-shadow:inset 0 1px var(--light),inset 0 2px var(--white);z-index:9000}

.sep{width:2px;flex:none;box-shadow:inset 1px 0 var(--shadow),inset -1px 0 var(--white);margin:0 1px}
.tasks{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
.task{display:flex;align-items:center;gap:4px;min-width:0;max-width:160px;flex:1 1 160px;padding:0 6px 0 4px;border:0;background:var(--face);box-shadow:var(--raised);text-align:left}
.task img{width:16px;height:16px;flex:none}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{box-shadow:var(--pressed);font-weight:bold;background:repeating-conic-gradient(var(--white) 0 25%,var(--face) 0 50%) 0 0/2px 2px}
.tray{display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;box-shadow:inset -1px -1px var(--white),inset 1px 1px var(--shadow);flex:none;margin-right:calc(env(safe-area-inset-right,0px))}
.tray img{width:16px;height:16px}

/* ---------- Menu Démarrer ---------- */
#startmenu{position:fixed;left:calc(2px + env(safe-area-inset-left,0px));bottom:calc(var(--tb) - 2px + env(safe-area-inset-bottom,0px));display:flex;background:var(--face);box-shadow:var(--raised);padding:3px;z-index:9100}

.band{width:24px;background:linear-gradient(0deg,var(--navy),var(--blue));display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}

/* ---------- Boîte de dialogue Réglages ---------- */

.tab[aria-selected="true"]{top:0;padding:4px 12px 4px;z-index:2;background:var(--face)}

.tabpane[hidden]{display:none}
fieldset{border:0;box-shadow:inset -1px -1px var(--white),inset 1px 1px var(--shadow),inset -2px -2px var(--shadow),inset 2px 2px var(--white);padding:10px 10px 10px;margin:0 0 10px}
legend{padding:0 3px}
.row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.row label{white-space:nowrap}
input[type=text],input[type=email],input[type=password],input[type=url]{font:inherit;width:100%;height:21px;padding:2px 3px;border:0;background:#fff;box-shadow:var(--sunken);user-select:text;-webkit-user-select:text;border-radius:0}

.dlgfoot{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}

/* ---------- Icône décorative ---------- */
.dicon{touch-action:none}

.dicon.ghost span{background:var(--navy);border-color:#ff0;text-shadow:none}

/* ---------- Explorateur (My Documents) ---------- */
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:3px 2px 4px;flex:none;align-items:center}

.addr{display:flex;align-items:center;gap:6px;padding:0 2px 4px;flex:none}

/* ---------- Démineur ---------- */
.win.mines{min-width:0;min-height:0;max-width:calc(100vw - 4px)}

.ms-top{display:flex;align-items:center;justify-content:space-between;padding:4px 5px;margin-bottom:6px;box-shadow:inset 2px 2px var(--shadow),inset -2px -2px var(--white)}
.led{display:flex;padding:1px;background:#000;box-shadow:1px 1px var(--white),-1px -1px var(--shadow)}
.led svg{display:block;width:13px;height:23px}
.face{width:26px;height:26px;padding:0;border:1px solid var(--shadow);background:var(--face);box-shadow:var(--raised);display:grid;place-items:center}
.face:active{box-shadow:inset 1px 1px var(--shadow)}

.ms-wrap{overflow:auto;max-width:calc(100vw - 30px);box-shadow:inset 3px 3px var(--shadow),inset -3px -3px var(--white);padding:3px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--c));touch-action:manipulation;-webkit-touch-callout:none}
.cell{width:var(--c);height:var(--c);background:var(--face);box-shadow:inset calc(-1 * var(--b)) calc(-1 * var(--b)) var(--shadow),inset var(--b) var(--b) var(--white);--b:max(2px,calc(var(--c) / 12));display:grid;place-items:center;font:900 calc(var(--c) * .78)/1 "Arial Black",Tahoma,Arial,sans-serif;background-repeat:no-repeat;background-position:center;background-size:calc(var(--c) - 3px)}

.n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}
.mspanel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(192,192,192,.6);z-index:6}

.colrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:0 0 10px}

/* ---------- Solitaire ---------- */
.win.sol{min-width:300px;min-height:260px}
.mwrap{position:relative;display:inline-block}

.solmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2001;background:var(--face);box-shadow:var(--raised);padding:3px 3px 10px;min-width:230px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);display:flex;flex-direction:column;font-size:11px}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);

/* ================= Icônes en pixel art (dessinées pixel par pixel) ================= */
const ICON = {};
function px(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"); const p = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  draw(p, g); return c.toDataURL();
}
const dist = (x, y, c) => Math.hypot(x + .5 - c, y + .5 - c);

ICON.vinyl = px(32, p => {
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    const d = dist(x, y, 16); if (d > 15.2) continue;
    let col = "#161616";
    if (d > 14.3) col = "#000";
    else if (Math.abs(d - 12) < .5 || Math.abs(d - 9.5) < .5 || Math.abs(d - 7.4) < .45) col = "#2e2e2e";
    if (d < 6.2) col = "#c8261e";
    if (d < 6.2 && d > 5.4) col = "#8a140f";
    if (d < 6.2 && (x + y) % 7 === 0 && y < 15) col = "#e8534a";
    if (d < 1.4) col = "#000";
    const a = Math.atan2(y + .5 - 16, x + .5 - 16);
    if (d > 7 && d < 14 && a > -2.5 && a < -1.9 && (Math.round(d) % 2)) col = "#8c8c8c";
    if (d > 7 && d < 14 && a > .6 && a < 1.1 && (Math.round(d) % 2)) col = "#5a5a5a";
    p(x, y, col);

  R(9, 4, 19, 26, "#000");                      // tome de derrière (pile)

  R(5, 2, 19, 28, "#000");                      // tome de devant
  R(6, 3, 17, 26, "#f6f2e6"); R(6, 3, 4, 26, "#c0392b"); R(7, 4, 2, 24, "#e05a4a");
  R(11, 5, 10, 3, "#000"); R(12, 6, 3, 1, "#fff"); R(16, 6, 4, 1, "#fff");   // titre
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) { const d = Math.hypot(x + .5 - 16, y + .5 - 15); if (d < 4.2 && x > 10 && x < 23) p(x, y, d < 3.2 ? "#f0c020" : "#c08a00"); }

/* Raccourcis du bureau */
const icons = $("#icons");
const DECO = { bin: "Recycle Bin" };
const ICON_IDS = ["computer", "explorer", "vinyls", "films", "cards", "manga", "docs", "cd", "calc", "ie", "sol", "mines", "bin"];
const iconOrder = (() => { let o = []; try { o = JSON.parse(localStorage.getItem("h97-icons")) || []; } catch {} o = o.filter(x => ICON_IDS.includes(x)); return [...o, ...ICON_IDS.filter(x => !o.includes(x))]; })();
iconOrder.forEach(id => {
  const b = document.createElement(DECO[id] ? "div" : "button");
  if (DECO[id]) { b.className = "dicon deco"; b.setAttribute("aria-hidden", "true"); b.innerHTML = `<img data-icon="${id}" alt=""><span>${DECO[id]}</span>`; }
  else { const a = APPS[id]; b.className = "dicon"; b.type = "button"; b.dataset.app = id; b.innerHTML = `<img data-icon="${a.icon}" alt=""><span>${a.label}</span>`; }
  b.dataset.id = id; icons.appendChild(b);
});
fillIcons(icons);
let lastPointer = "mouse";
icons.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });

/* Glisser-déposer pour changer l’ordre des icônes (souris et doigt) */
let drag = null, swallowClick = false;
icons.addEventListener("pointerdown", e => {
  const it = e.target.closest(".dicon"); if (!it || e.button > 0) return;
  drag = { it, x: e.clientX, y: e.clientY, pid: e.pointerId, on: false };
});
addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
    drag.on = true; const r = drag.it.getBoundingClientRect();
    drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    drag.ghost = drag.it.cloneNode(true); drag.ghost.classList.add("ghost"); drag.ghost.classList.remove("sel");
    document.body.appendChild(drag.ghost); drag.it.classList.add("moving"); document.body.classList.add("dragging"); closeStart();
  }
  drag.ghost.style.left = e.clientX - drag.dx + "px"; drag.ghost.style.top = e.clientY - drag.dy + "px";
  const t = document.elementFromPoint(e.clientX, e.clientY), over = t && t.closest(".icons .dicon");
  if (!over || over === drag.it) return;
  const r = over.getBoundingClientRect(), all = [...icons.children];
  const after = all.indexOf(over) > all.indexOf(drag.it) ? e.clientY > r.top + r.height * .25 : e.clientY > r.top + r.height * .75;
  icons.insertBefore(drag.it, after ? over.nextSibling : over);
});
const endDrag = () => {
  if (!drag) return;
  if (drag.on) {
    drag.ghost.remove(); drag.it.classList.remove("moving"); document.body.classList.remove("dragging");
    try { localStorage.setItem("h97-icons", JSON.stringify([...icons.children].map(x => x.dataset.id))); } catch {}
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
  }
  drag = null;
};
addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
icons.addEventListener("dragstart", e => e.preventDefault());
icons.addEventListener("click", e => { if (swallowClick) { e.stopImmediatePropagation(); swallowClick = false; } }, true);
icons.addEventListener("click", e => {
  const b = e.target.closest("button.dicon");
  icons.querySelectorAll(".dicon").forEach(x => x.classList.toggle("sel", x === b));
  if (b && (lastPointer !== "mouse" || e.detail === 0)) openApp(b.dataset.app); // un toucher ou Entrée ouvre directement
});
icons.addEventListener("dblclick", e => { const b = e.target.closest("button.dicon"); if (b) openApp(b.dataset.app); });
$("#desktop").addEventListener("pointerdown", e => { if (!e.target.closest("button.dicon")) icons.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); });

/* ================= Fenêtres ================= */
const wins = {}; let zTop = 10, cascade = 0;
const small = () => innerWidth < 700 || innerHeight < 500;
const TBTN = `<button class="tbtn" data-w="min" aria-label="Réduire"><svg width="8" height="8" viewBox="0 0 8 8"><rect x="1" y="6" width="6" height="2"/></svg></button>
      <button class="tbtn" data-w="max" aria-label="Agrandir"><svg width="9" height="9" viewBox="0 0 9 9"><path d="M0 0h9v9H0zM1 2v6h7V2z" fill-rule="evenodd"/></svg></button>`;

function openApp(id, opts = {}) {
  closeStart();
  if (wins[id]) { wins[id].el.hidden = false; focusWin(id); if (id === "settings" && opts.tab) { setSettingsMode(wins[id].el, opts.mode); selectSettingsTab(wins[id].el, opts.tab, opts); } return; }
  const a = APPS[id], el = document.createElement("section");
  el.className = "win" + (a.dialog ? " dlg" : "") + (a.page ? " page " + a.page : ""); el.setAttribute("aria-label", a.title);
  let body;
  if (a.dialog) body = `<div class="wbody">${settingsHtml()}</div>`;
  else if (a.page === "docs") body = docsHtml();
  else if (a.page === "ie") body = ieHtml();
  else if (a.page === "mines") body = minesHtml();
  else if (a.page === "sol") body = solHtml();
  else if (a.page === "computer") body = compHtml(a.tree);
  else if (a.page === "cd") body = cdHtml();
  else if (a.page === "calc") body = calcHtml();
  else body = `<div class="menubar" aria-hidden="true"><span><u>F</u>ile</span><span><u>V</u>iew</span><span><u>H</u>elp</span></div>
       <div class="wbody"><p class="loading">Ouverture de ${a.label}…</p><iframe title="${a.title}" src="${a.src}"></iframe><div class="shield"></div></div>`;
  el.innerHTML = `
    <header class="tbar"><img data-icon="${a.icon}" alt=""><b>${a.title}</b>
      ${a.dialog ? "" : TBTN}
      <button class="tbtn x" data-w="close" aria-label="Fermer"><svg width="8" height="7" viewBox="0 0 8 7"><path d="M0 0h2l2 2 2-2h2L5 3.5 8 7H6L4 5 2 7H0l3-3.5z"/></svg></button>
    </header>
    ${body}${a.dialog || a.fixed ? "" : `<div class="grip" aria-hidden="true"></div>`}`;
  fillIcons(el);
  $("#windows").appendChild(el);
  const W = innerWidth, H = innerHeight - 30;
  if (a.dialog) {
    const w = Math.min(440, W - 16);
    Object.assign(el.style, { width: w + "px", maxHeight: (H - 16) + "px", left: (W - w) / 2 + "px" });
  } else if (a.fixed) {
    el.style.left = "-9999px"; el.style.top = "0px";  // placé après mesure, dans initMines
  } else if (a.page) {
    const w = Math.min(a.size[0], W - 20), h = Math.min(a.size[1], H - 20), o = (cascade++ % 4) * 26;
    Object.assign(el.style, { width: w + "px", height: h + "px", left: Math.max(4, Math.round((W - w) / 2) + o - 40) + "px", top: Math.max(4, Math.round((H - h) / 2) + o - 40) + "px" });
    if (W < 520) el.classList.add("max");

function skinFrame(f) {
  let d; try { d = f.contentDocument; } catch { return; }
  if (!d || !d.documentElement || d.getElementById("h97-cursors")) return;
  const cs = getComputedStyle(document.documentElement), CUR = cs.getPropertyValue("--cur").trim(), HAND = cs.getPropertyValue("--hand").trim();
  const st = d.createElement("style"); st.id = "h97-cursors";
  st.textContent = `html{cursor:${CUR};touch-action:manipulation}*{cursor:inherit}
    input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=button]):not([type=submit]):not([type=file]),textarea,[contenteditable="true"]{cursor:text}
    button:not([disabled]),a[href],select,label,summary,[role=button],[role=tab],[role=switch],input[type=checkbox],input[type=radio],input[type=range]{cursor:${HAND}}`;
  (d.head || d.documentElement).appendChild(st);
  // les éléments que le site rend cliquables avec « cursor: pointer » prennent la main
  const seen = new WeakSet();
  d.addEventListener("mouseover", e => {
    const t = e.target; if (!t || t.nodeType !== 1 || seen.has(t)) return;
    seen.add(t);

}

function dragify(el, id) {
  /* Comme sous Windows 98 (et sur win98.si) : pendant le déplacement, seul un contour pointillé suit la souris ;
     la fenêtre reste en place et saute à l'arrivée quand on relâche. */
  const bar = el.querySelector(".tbar");
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest("[data-w]") || el.classList.contains("max") || e.button > 0) return;
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
    let fx = ox, fy = oy, frame = null;
    document.body.classList.add("dragging"); bar.setPointerCapture(e.pointerId);
    const mv = ev => {
      fx = Math.min(innerWidth - 60, Math.max(60 - w, ox + ev.clientX - sx));
      fy = Math.min(innerHeight - 60, Math.max(0, oy + ev.clientY - sy));
      if (!frame) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 3) return;   // un simple clic ne fait rien bouger
        frame = document.createElement("div"); frame.className = "dragframe"; frame.style.width = w + "px"; frame.style.height = h + "px";
        document.body.appendChild(frame);

    };
    const up = ev => {
      document.body.classList.remove("dragging");
      bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up);
      if (frame) { frame.remove(); if (ev.type !== "pointercancel") { el.style.left = fx + "px"; el.style.top = fy + "px"; } }
    };
    bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
  });
}

/* ================= My Documents : images rangées dans le navigateur (IndexedDB) ================= */
const docsDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("hobbys97", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("images", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, f) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction("images", mode), q = f(t.objectStore("images"));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  }));
  return { all: () => run("readonly", s => s.getAll()), put: r => run("readwrite", s => s.put(r)), del: id => run("readwrite", s => s.delete(id)) };
})();
let userImgs = [];              // { id, name, blob, added }
const blobUrls = {};
const imgUrl = im => blobUrls[im.id] || (blobUrls[im.id] = URL.createObjectURL(im.blob));
async function loadDocs() { try { userImgs = ((await docsDB.all()) || []).sort((a, b) => a.added - b.added); } catch { userImgs = []; } }
function allDocs() {
  return [...WALLS.map(w => ({ id: w.id, name: w.name, builtin: true, mode: w.mode, url: () => wallUrl(w) })),
          ...userImgs.map(im => ({ id: im.id, name: im.name, mode: "fill", url: () => imgUrl(im) }))];
}
async function importImages(files) {
  const list = [...(files || [])].filter(f => /^image\//.test(f.type));
  if (!list.length) return 0;
  for (const f of list) { await docsDB.put({ id: "u-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name: f.name, blob: f, added: Date.now() }); }
  await loadDocs(); docsChanged(); return list.length;
}
async function deleteImage(id) {
  await docsDB.del(id); if (blobUrls[id]) { URL.revokeObjectURL(blobUrls[id]); delete blobUrls[id]; }
  await loadDocs();
  if (wallpaper.id === id) setWallpaper({ id: "", mode: "center" });
  docsChanged();
}
function pickFiles(cb) {
  const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.multiple = true;
  i.addEventListener("change", () => cb(i.files)); i.click();
}
function docsChanged() {
  if (wins.docs) renderDocs(wins.docs.el);
  if (wins.settings) renderWallList(wins.settings.el);
}

function paint(el, wp) {
  el.style.backgroundColor = wp.color || "#008080";
  const d = wp.id && allDocs().find(x => x.id === wp.id);
  if (!d) { el.style.backgroundImage = "none"; return; }
  el.style.backgroundImage = `url("${d.url()}")`;
  const m = wp.mode;
  el.style.backgroundRepeat = m === "tile" ? "repeat" : "no-repeat";
  el.style.backgroundPosition = m === "tile" ? "0 0" : "center";
  el.style.backgroundSize = m === "stretch" ? "100% 100%" : m === "fill" ? "cover" : "auto";
  el.style.imageRendering = m === "tile" ? "pixelated" : "auto";
}
function setWallpaper(wp) {
  wallpaper = { id: wp.id || "", mode: wp.mode || "center", color: wp.color || "#008080" };
  try { localStorage.setItem("h97-wallpaper", JSON.stringify(wallpaper)); } catch {}
  paint($("#desktop"), wallpaper);
}

function initDocs(el) {
  el.classList.add("ie");
  el.querySelector(".iebar").addEventListener("click", async e => {
    const b = e.target.closest("[data-d]"); if (!b || b.disabled) return;
    const k = b.dataset.d, sel = el.dataset.sel;
    if (k === "import") {
      if (el.dataset.dir === "mus") pickAudio(async fl => { const n = await importSongs(fl); el.querySelector(".st1").textContent = n ? `${n} morceau${n > 1 ? "x" : ""} ajouté${n > 1 ? "s" : ""}` : "Aucun fichier audio reconnu"; });
      else pickFiles(async fl => { const n = await importImages(fl); el.querySelector(".st1").textContent = n ? `${n} image${n > 1 ? "s" : ""} importée${n > 1 ? "s" : ""}` : "Aucune image reconnue"; });
    }
    else if (k === "wall" && sel) openApp("settings", { tab: "bg", select: sel });
    else if (k === "del" && sel) {
      if (/^s-/.test(sel)) { const t = musTracks().find(x => x.id === sel); if (t && confirm(`Supprimer « ${t.title} » ?`)) { delete el.dataset.sel; await deleteSong(sel); renderDocs(el); } return; }
      const d = allDocs().find(x => x.id === sel); if (d && !d.builtin && confirm(`Supprimer « ${d.name} » ?`)) { delete el.dataset.sel; await deleteImage(sel); }
    }
    else if ((k === "up" || k === "back") && el.dataset.dir) { el.dataset.dir = ""; delete el.dataset.sel; renderDocs(el); }
  });
  const files = el.querySelector(".files");
  let lastPT = "mouse";
  files.addEventListener("pointerdown", e => { lastPT = e.pointerType; });
  files.addEventListener("click", e => {
    const f = e.target.closest(".file"); el.dataset.sel = f ? f.dataset.id : "";
    if (!f) delete el.dataset.sel;
    renderDocs(el, true);   // sélection seule : on ne reconstruit pas la liste, sinon le double-clic est perdu
    if (f && (lastPT !== "mouse" || e.detail === 0)) openDocsItem(el, f.dataset.id);
  });
  files.addEventListener("dblclick", e => { const f = e.target.closest(".file"); if (f) openDocsItem(el, f.dataset.id); });
  const wb = el.querySelector(".wbody");
  ["dragenter", "dragover"].forEach(t => wb.addEventListener(t, e => { e.preventDefault(); }));
  wb.addEventListener("drop", async e => {
    e.preventDefault(); const fl = [...e.dataTransfer.files];
    if (fl.some(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|ogg|wav|flac)$/i.test(f.name))) { el.dataset.dir = "mus"; await importSongs(fl); renderDocs(el); }
    else { el.dataset.dir = "img"; await importImages(fl); }
  });
  renderDocs(el);
}
function openDocsItem(el, id) {
  if (id === "images") { el.dataset.dir = "img"; delete el.dataset.sel; return renderDocs(el); }
  if (id === "musique") { el.dataset.dir = "mus"; delete el.dataset.sel; return renderDocs(el); }
  if (el.dataset.dir === "mus") { openApp("cd", { track: id }); if (wins.cd) wins.cd.el._cd.play(id); return; }
  openApp("settings", { tab: "bg", select: id });
}

function renderDocs(el, selOnly) {
  const inImg = el.dataset.dir === "img", docs = allDocs(), sel = el.dataset.sel, files = el.querySelector(".files");
  const inMus = el.dataset.dir === "mus", songs = musTracks();
  const list = inMus ? songs.map(t => ({ id: t.id, name: t.title, song: t })) : inImg ? docs
    : [{ id: "images", name: "Images", folder: true }, { id: "musique", name: "Musique", folder: true }];
  if (selOnly) files.querySelectorAll(".file").forEach(b => b.classList.toggle("sel", b.dataset.id === sel));
  else files.innerHTML = list.map(d => d.song
    ? `<button class="file${d.id === sel ? " sel" : ""}" type="button" role="option" data-id="${d.id}"><img class="fico" src="${ICON.cdplayer}" alt=""><span>${esc(d.name)}</span></button>`
    : d.folder
    ? `<button class="file${d.id === sel ? " sel" : ""}" type="button" role="option" data-id="${d.id}"><img class="fico" src="${ICON.folder}" alt=""><span>${esc(d.name)}</span></button>`
    : `<button class="file${d.id === sel ? " sel" : ""}" type="button" role="option" data-id="${d.id}">${d.mode === "tile" && d.builtin ? `<span class="th" style="background:url(&quot;${d.url()}&quot;) repeat;image-rendering:pixelated"></span>` : `<span class="th"><img src="${d.url()}" alt=""></span>`}<span>${esc(d.name)}</span></button>`).join("");
  const cur = list.find(d => d.id === sel), n = list.length;
  el.querySelector("[data-d='wall']").disabled = !cur || cur.folder || !!cur.song;
  el.querySelector("[data-d='del']").disabled = !cur || cur.folder || (cur.song ? !/^s-/.test(cur.id) : cur.builtin);
  el.querySelector("[data-d='up']").disabled = !inImg && !inMus;
  el.querySelector("[data-d='back']").disabled = !inImg && !inMus;
  el.querySelector("[data-d='import']").querySelector("span").textContent = inMus ? "Ajouter" : "Import";
  el.querySelector(".mcpath").textContent = inMus ? "C:\\My Documents\\Musique" : inImg ? "C:\\My Documents\\Images" : "C:\\My Documents";
  el.querySelector(".mcai").src = ICON[inImg || inMus ? "folder" : "docs"];
  el.querySelector(".mcsi").src = ICON.computer;
  const folderName = inMus ? "Musique" : inImg ? "Images" : "My Documents";
  el.querySelector(".mcbig").src = cur && cur.song ? ICON.cdplayer : cur && !cur.folder ? cur.url() : ICON[inImg || inMus ? "folder" : "docs"];
  el.querySelector(".mcbig").className = "mcbig" + (cur && !cur.folder && !cur.song ? " shot" : "");
  el.querySelector(".mctitle").textContent = cur ? cur.name : folderName;
  el.querySelector(".mcdesc").innerHTML = cur
    ? (cur.song ? `${esc(cur.song.artist)}${cur.song.album ? "<br>" + esc(cur.song.album) : ""}<br>${mmss(cur.song.dur)} m:s<br>Double-clique pour l’écouter.`
      : cur.folder ? (cur.id === "musique" ? "Tes morceaux, lus par le CD Player." : "Tes images et tes fonds d’écran.")
      : `${cur.builtin ? "Fond d’écran d’origine" : "Image importée"}.<br>Double-clique pour la mettre en fond d’écran.`)
    : inMus ? `${songs.length} morceau${songs.length > 1 ? "x" : ""}.<br>Glisse des fichiers audio ici pour les ajouter.`
    : inImg ? `${docs.length} image${docs.length > 1 ? "s" : ""}.<br>Glisse des images ici pour les ajouter.` : "Sélectionne un élément pour afficher sa description.";
  el.querySelector(".tbar b").textContent = folderName;
  const w = wins.docs; if (w) { const ts = w.task.querySelector("span"); if (ts) ts.textContent = folderName; }
  el.querySelector(".st1").textContent = cur ? "1 objet(s) sélectionné(s)" : `${n} objet(s)`;

function initIe(el) {
  const u = LS.get("mv-discogs-user");
  if (u) el.querySelectorAll("[data-pl=dg]").forEach(a => { a.href = `https://www.discogs.com/user/${encodeURIComponent(u)}/collection`; });
  const st = el.querySelector(".st1"), inp = el.querySelector(".ieaddr input"), page = el.querySelector(".iepage"), fav = el.querySelector(".iefav");
  el.querySelector(".iedate").textContent = new Date().toLocaleDateString("fr-FR");
  const load = (ms, after) => {
    netActivity(true); st.textContent = "Connexion au site…"; page.style.visibility = "hidden";
    setTimeout(() => {
      st.textContent = "Chargement…";
      setTimeout(() => { page.style.visibility = ""; page.scrollTop = 0; st.textContent = "Done"; netActivity(false); if (after) after(); }, ms * .5);
    }, ms * .5);
  };
  load(900);
  const bind = () => el.querySelectorAll("a[href]").forEach(a => {
    a.addEventListener("mouseenter", () => { st.textContent = a.href; });
    a.addEventListener("mouseleave", () => { st.textContent = "Done"; });
  });
  bind();
  const go = q => {
    q = q.trim(); if (!q || q === IE_HOME) { inp.value = IE_HOME; return; }
    let url;
    if (/^https?:\/\//i.test(q)) url = q;
    else if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) url = "https://" + q;
    else url = "https://www.google.com/search?q=" + encodeURIComponent(q);
    netActivity(true);
    setTimeout(() => { window.open(url, "_blank", "noopener"); netActivity(false); inp.value = IE_HOME; st.textContent = "Ouvert dans un nouvel onglet"; setTimeout(() => { st.textContent = "Done"; }, 2500); }, 600);
  };
  el.querySelector(".ieaddr").addEventListener("submit", e => { e.preventDefault(); go(inp.value); });
  inp.addEventListener("focus", () => inp.select());
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-ie]"); if (!b || b.disabled) return;
    const k = b.dataset.ie;
    if (k === "reload" || k === "home") { inp.value = IE_HOME; load(700); }

    else if (k === "favs") fav.hidden = !fav.hidden;
    else if (k === "nofav") fav.hidden = true;
    else if (k === "search") inp.focus();
  });
}

function initComp(el, tree) {
  el.classList.add("ie");
  let cur = "root", sel = null, back = [], fwd = [];
  const $c = s => el.querySelector(s), grid = $c(".mcgrid");
  const parentOf = id => FS_PARENT[id];
  function go(id, push = true) {
    if (push && id !== cur) { back.push(cur); fwd = []; }
    cur = id; sel = null; draw();
  }
  function drawTreePane() {
    const box = el.querySelector(".mctb"); if (!box) return;
    const open = new Set(); for (let k = cur; k; k = parentOf(k)) open.add(k);
    const rows = [];
    const walk = (id, depth) => {
      const n = FS[id], kids = n.items || [], exp = open.has(id);
      rows.push(`<button class="trow${id === cur ? " on" : ""}" type="button" data-t="${id}" style="--d:${depth}">${kids.length ? `<span class="tpm">${exp ? "−" : "+"}</span>` : `<span class="tpm empty"></span>`}<img data-icon="${n.icon}" alt=""><span class="lb">${esc(n.name)}</span></button>`);
      if (exp) kids.forEach(k => walk(k, depth + 1));
    };
    walk("root", 0);
    rows.push(`<button class="trow" type="button" data-t="" disabled><span class="tpm empty"></span><img data-icon="bin" alt=""><span class="lb">Recycle Bin</span></button>`);
    box.innerHTML = rows.join(""); fillIcons(box);
    box.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { if (b.dataset.t) go(b.dataset.t); }));
  }
  function draw() {
    const n = FS[cur];
    grid.innerHTML = n.items.map(k => `<button type="button" class="mci" data-k="${k}" role="option"><img data-icon="${FS[k].icon}" alt=""><span>${FS[k].name}</span></button>`).join("") || `<p class="mcempty">Ce dossier est vide.</p>`;
    fillIcons(grid);
    $c(".mcbig").src = ICON[n.icon]; $c(".mctitle").textContent = n.name; $c(".mcpath").textContent = n.addr || n.name;
    $c(".mcai").src = ICON[n.icon]; $c(".mcsi").src = ICON[n.icon]; $c(".mcloc").textContent = n.name;
    el.querySelector(".tbar b").textContent = (tree ? "Exploring - " : "") + n.name;
    el.querySelector(".tbar img").src = ICON[tree ? "explorer" : n.icon];
    const me = Object.entries(wins).find(([, w]) => w.el === el);
    if (me) { const ts = me[1].task.querySelector("span"); if (ts) ts.textContent = n.name; const ti = me[1].task.querySelector("img"); if (ti) ti.src = ICON[tree ? "explorer" : n.icon]; }
    $c("[data-mc=back]").disabled = !back.length; $c("[data-mc=fwd]").disabled = !fwd.length; $c("[data-mc=up]").disabled = cur === "root";
    describe(); drawTreePane();
  }
  function describe() {
    const n = sel ? FS[sel] : FS[cur];
    $c(".mcdesc").innerHTML = sel ? `<b>${esc(n.name)}</b><br>${esc(n.desc || "").replace(/\n/g, "<br>")}` : esc(cur === "root" ? FS.root.desc : (n.desc || "")).replace(/\n/g, "<br>");
    grid.querySelectorAll(".mci").forEach(b => b.classList.toggle("sel", b.dataset.k === sel));
    const count = (FS[cur].items || []).length;
    $c(".st1").textContent = sel ? "1 objet(s) sélectionné(s)" : `${count} objet(s)`;
    $c(".st2").textContent = !sel ? "" : FS[sel].app ? "Programme" : FS[sel].notReady ? "Lecteur de disquettes" : FS[sel].box ? "Dossier système" : sel === "c" ? "Disque local" : "Dossier";
  }
  function openItem(k) {
    const n = FS[k];
    if (n.notReady) return sysBox("floppy", "Erreur", `<div style="display:flex;gap:12px;align-items:flex-start"><span class="mmi">✕</span><p style="margin:0;line-height:1.5">A:\\ n’est pas accessible.<br><br>Le périphérique n’est pas prêt.</p></div>`, [["Recommencer", true], ["Annuler"]]);
    if (n.box === "printers") return printersBox();
    if (n.items) return go(k);
    if (n.app) openApp(n.app);
  }
  let lastPT = "mouse";
  grid.addEventListener("pointerdown", e => { lastPT = e.pointerType; });
  grid.addEventListener("click", e => {
    const b = e.target.closest(".mci"); sel = b ? b.dataset.k : null; describe();
    if (b && (lastPT !== "mouse" || e.detail === 0)) openItem(b.dataset.k);
  });
  grid.addEventListener("dblclick", e => { const b = e.target.closest(".mci"); if (b) openItem(b.dataset.k); });
  grid.addEventListener("keydown", e => { if (e.key === "Backspace") { e.preventDefault(); if (cur !== "root") go(parentOf(cur) || "root"); } });
  el.querySelectorAll("[data-mc]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.mc;
    if (k === "back" && back.length) { fwd.push(cur); go(back.pop(), false); }
    else if (k === "fwd" && fwd.length) { back.push(cur); go(fwd.pop(), false); }
    else if (k === "up" && cur !== "root") go(parentOf(cur) || "root");
    else if (k === "notree") el.querySelector(".mcbody").classList.remove("withtree");
  }));
  draw();
}

function musTracks() {

  musList = [...base, ...userSongs.map(u => ({ id: u.id, src: null, blob: u.blob, name: u.name, artist: u.artist || "Mes fichiers", title: u.title || u.name, album: "", dur: u.dur || 0 }))];

let userSongs = [];
const songDB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("hobbys97-audio", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("songs", { keyPath: "id" });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, f) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction("songs", mode), q = f(t.objectStore("songs"));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  }));
  return { all: () => run("readonly", s => s.getAll()), put: r => run("readwrite", s => s.put(r)), del: id => run("readwrite", s => s.delete(id)) };
})();
async function loadSongs() { try { userSongs = ((await songDB.all()) || []).sort((a, b) => a.added - b.added); } catch { userSongs = []; } musList = null; }
async function importSongs(files) {
  const list = [...(files || [])].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|ogg|wav|flac)$/i.test(f.name));
  for (const f of list) await songDB.put({ id: "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), name: f.name, title: f.name.replace(/\.[^.]+$/, ""), blob: f, added: Date.now() });
  await loadSongs(); if (wins.docs) renderDocs(wins.docs.el); if (wins.cd) wins.cd.el._cd.refresh();
  return list.length;
}
async function deleteSong(id) { await songDB.del(id); await loadSongs(); if (wins.docs) renderDocs(wins.docs.el); if (wins.cd) wins.cd.el._cd.refresh(); }

const SEG7 = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg", " ": "", "-": "g" };
function lcd(txt, cls = "") {
  const P = { a: "M2 1h9l-2 2H4z", b: "M11.5 1.5v9l-2-1.5V3.5z", c: "M11.5 12.5v9l-2-2v-6z", d: "M2 22h9l-2-2H4z", e: "M1.5 12.5v9l2-2v-6z", f: "M1.5 1.5v9l2-1.5V3.5z", g: "M2 11.5l2-1.3h5l2 1.3-2 1.3H4z" };
  return [...txt].map(ch => {
    if (ch === ":") return `<svg class="colon" viewBox="0 0 5 23"><rect x="1" y="6" width="3" height="3" fill="#f0c000"/><rect x="1" y="14" width="3" height="3" fill="#f0c000"/></svg>`;
    if (ch === "[" || ch === "]") return `<svg viewBox="0 0 7 23"><path d="${ch === "[" ? "M6 1H1v21h5v-2H3V3h3z" : "M1 1h5v21H1v-2h3V3H1z"}" fill="#f0c000"/></svg>`;
    const on = SEG7[ch] || "";
    return `<svg class="dig ${cls}" viewBox="0 0 13 23">${Object.entries(P).map(([k, d]) => `<path d="${d}" fill="${on.includes(k) ? "#f0c000" : "#3a2e00"}"/>`).join("")}</svg>`;
  }).join("");
}

function initCalc(el) {
  const $c = s => el.querySelector(s), out = $c(".calcout");

  let sci = LS.get(CALC_KEY) === "sci";
  const fmt = n => {
    if (!isFinite(n)) return "Erreur";

    if (base !== "dec") { const i = Math.trunc(n); return (i < 0 ? "-" : "") + Math.abs(i).toString({ hex: 16, oct: 8, bin: 2 }[base]).toUpperCase(); }
    let t = String(+n.toPrecision(15));

  };
  const parse = t => {
    const base = $c("input[name=base]:checked").value;
    return base === "dec" ? parseFloat(t) || 0 : parseInt(t, { hex: 16, oct: 8, bin: 2 }[base]) || 0;
  };
  const show = t => { out.textContent = t; el.querySelectorAll(".memind:not(.paren)").forEach(m => { m.textContent = mem ? "M" : ""; }); };
  const parens = () => { const p = el.querySelector(".memind.paren"); if (p) p.textContent = open.length ? "(".repeat(Math.min(3, open.length)) : ""; };
  const ang = v => { const a = $c("input[name=ang]:checked").value; return a === "degrees" ? v * Math.PI / 180 : a === "gradients" ? v * Math.PI / 200 : v; };
  const unang = v => { const a = $c("input[name=ang]:checked").value; return a === "degrees" ? v * 180 / Math.PI : a === "gradients" ? v * 200 / Math.PI : v; };
  let expMode = false, feMode = false;
  function apply() {

    if (op === "+") acc += b; else if (op === "-") acc -= b; else if (op === "*") acc *= b;
    else if (op === "/") acc = b === 0 ? NaN : acc / b; else if (op === "pow") acc = Math.pow(acc, b);
    else if (op === "mod") acc = b === 0 ? NaN : acc % b;
    else if (op === "and") acc = Math.trunc(acc) & Math.trunc(b);
    else if (op === "or") acc = Math.trunc(acc) | Math.trunc(b);
    else if (op === "xor") acc = Math.trunc(acc) ^ Math.trunc(b);
    else if (op === "lsh") acc = Math.trunc(acc) << Math.trunc(b);
    else acc = b;
    cur = fmt(acc); show(cur); fresh = true;
  }
  function digit(d) {
    const base = $c("input[name=base]:checked").value, max = { hex: 16, dec: 10, oct: 8, bin: 2 }[base];
    if (parseInt(d, 16) >= max) return;
    cur = fresh || cur === "0" ? String(d) : cur + d; fresh = false; show(cur);
  }
  function unary(k) {
    const v = parse(cur); let r = v;
    const inv = $c("#cInv") && $c("#cInv").checked, hyp = $c("#cHyp") && $c("#cHyp").checked;
    if (k === "sqrt") r = Math.sqrt(v); else if (k === "sqr") r = inv ? Math.sqrt(v) : v * v; else if (k === "cube") r = inv ? Math.cbrt(v) : v ** 3;
    else if (k === "inv") r = v === 0 ? NaN : 1 / v; else if (k === "ln") r = inv ? Math.exp(v) : Math.log(v); else if (k === "log") r = inv ? 10 ** v : Math.log10(v);
    else if (k === "sin") r = hyp ? (inv ? Math.asinh(v) : Math.sinh(v)) : inv ? unang(Math.asin(v)) : Math.sin(ang(v));
    else if (k === "cos") r = hyp ? (inv ? Math.acosh(v) : Math.cosh(v)) : inv ? unang(Math.acos(v)) : Math.cos(ang(v));
    else if (k === "tan") r = hyp ? (inv ? Math.atanh(v) : Math.tanh(v)) : inv ? unang(Math.atan(v)) : Math.tan(ang(v));
    else if (k === "int") r = Math.trunc(v); else if (k === "not") r = ~Math.trunc(v);
    else if (k === "dms") r = inv ? Math.trunc(v) + (v % 1) * 100 / 60 : Math.trunc(v) + (v % 1) * 60 / 100;

    else if (k === "neg") r = -v; else if (k === "pi") r = Math.PI;

    if (k === "mc") { mem = 0; show(cur); return; }
    if (k === "mr") { cur = fmt(mem); fresh = true; show(cur); return; }

    if (k === "(") { open.push([acc, op]); acc = 0; op = null; cur = "0"; fresh = true; show("0."); parens(); return; }
    if (k === ")") { if (!open.length) return; if (op) apply(); const [a, o] = open.pop(); const v = parse(cur); acc = a; op = o; cur = fmt(v); fresh = true; show(cur); parens(); return; }
    unary(k);
  }
  el.querySelector(".calcgrid").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) press(b.dataset.k); });
  el.querySelector(".calcmid").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) press(b.dataset.k); });
  el.classList.toggle("hexon", false);
  let lastBase = "dec";
  el.querySelectorAll("input[name=base]").forEach(r => r.addEventListener("change", () => {
    const radix = { hex: 16, dec: 10, oct: 8, bin: 2 }[lastBase];
    const v = lastBase === "dec" ? parseFloat(cur) || 0 : parseInt(cur, radix) || 0;   // on lit avec l'ancienne base
    lastBase = $c("input[name=base]:checked").value;
    cur = fmt(v); fresh = true; show(cur);
    el.classList.toggle("hexon", lastBase === "hex");
  }));
  el._keys = e => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) press(k);
    else if ("+-*/".includes(k) && k.length === 1) press(k);
    else if (k === "Enter" || k === "=") press("=");
    else if (k === ".") press(".");
    else if (k === "Backspace") press("back");
    else if (k === "Escape") press("c");
    else if (k === "Delete") press("ce");
    else return;
    e.preventDefault();
  };
  /* vue standard ou scientifique */
  function setView(v) {
    sci = v === "sci"; LS.set(CALC_KEY, sci ? "sci" : "std");
    el.classList.toggle("sci", sci);
    el.querySelectorAll("[data-km=std] .ck2, [data-km=sci] .ck2").forEach((c, i) => { c.textContent = (i === 0) !== sci ? "✓" : ""; });
    el.style.width = (sci ? "auto" : "262px"); if (sci) el.style.maxWidth = "calc(100vw - 12px)";
    requestAnimationFrame(() => {
      const W = innerWidth, H = innerHeight - 30;
      el.style.left = Math.max(2, Math.round((W - el.offsetWidth) / 2)) + "px";
      el.style.top = Math.max(2, Math.round((H - el.offsetHeight) / 2) - 20) + "px";
    });
  }
  const closeDrops = () => { el.querySelectorAll(".drop").forEach(d => { d.hidden = true; }); el.querySelectorAll("[data-mm]").forEach(b => b.setAttribute("aria-expanded", "false")); };
  el.querySelectorAll("[data-mm]").forEach(b => b.addEventListener("click", () => {
    const d = el.querySelector(`.drop[data-for="${b.dataset.mm}"]`), o = d.hidden; closeDrops(); d.hidden = !o; b.setAttribute("aria-expanded", String(o));
  }));
  document.addEventListener("pointerdown", e => { if (!e.target.closest || (!e.target.closest(".drop") && !e.target.closest("[data-mm]"))) closeDrops(); });
  el.querySelectorAll(".drop").forEach(d => d.addEventListener("click", e => {
    const b = e.target.closest("[data-km]"); if (!b) return; closeDrops(); const k = b.dataset.km;
    if (k === "std" || k === "sci") setView(k);
    else if (k === "copy") { try { navigator.clipboard.writeText(out.textContent.replace(/\.$/, "")); } catch {} }
    else if (k === "paste") { navigator.clipboard.readText().then(t => { cur = String(parseFloat(t) || 0); fresh = false; show(fmt(parse(cur))); }).catch(() => {}); }
    else if (k === "about") sysBox("calc", "À propos", `<p style="margin:0;line-height:1.55">Calculatrice de Hobbys97.<br>Vue standard ou scientifique dans le menu View.</p>`, [["OK", true]]);
  }));
  show("0."); setView(sci ? "sci" : "std");
}
document.addEventListener("keydown", e => { const w = wins.calc; if (w && w.el.classList.contains("active") && !w.el.hidden && w.el._keys && !e.ctrlKey && !e.metaKey) w.el._keys(e); });

/* ================= Démineur ================= */
const LEVELS = [
  { name: "Débutant", rows: 9, cols: 9, mines: 10 },
  { name: "Intermédiaire", rows: 16, cols: 16, mines: 40 },
  { name: "Expert", rows: 16, cols: 30, mines: 99 }
];
const SEG = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg", "-": "g" };
function ledDigit(ch) {
  const on = SEG[ch] || "", P = {
    a: "M2 1h9l-2 2H4z", b: "M11.5 1.5v9l-2-1.5V3.5z", c: "M11.5 12.5v9l-2-2v-6z", d: "M2 22h9l-2-2H4z",
    e: "M1.5 12.5v9l2-2v-6z", f: "M1.5 1.5v9l2-1.5V3.5z", g: "M2 11.5l2-1.3h5l2 1.3-2 1.3H4z" };
  return `<svg viewBox="0 0 13 23">${Object.entries(P).map(([k, d]) => `<path d="${d}" fill="${on.includes(k) ? "#ff0000" : "#3a0000"}"/>`).join("")}</svg>`;
}
const led = n => { n = Math.max(-99, Math.min(999, n)); const t = n < 0 ? "-" + String(-n).padStart(2, "0") : String(n).padStart(3, "0"); return [...t].map(ledDigit).join(""); };
function faceSvg(mood) {
  const eyes = mood === "dead" ? `<path d="M5 5l2 2M7 5l-2 2M10 5l2 2M12 5l-2 2" stroke="#000" stroke-width="1"/>`
    : mood === "cool" ? `<path d="M3 6h11v1h-1l-1 2H9.5L9 7H8l-.5 2H5L4 7H3z" fill="#000"/>`
    : `<rect x="5" y="5" width="2" height="2" fill="#000"/><rect x="10" y="5" width="2" height="2" fill="#000"/>`;
  const mouth = mood === "oh" ? `<ellipse cx="8.5" cy="12" rx="1.6" ry="2" fill="none" stroke="#000"/>`
    : mood === "dead" ? `<path d="M5.5 13.5q3-3 6 0" fill="none" stroke="#000"/>`
    : `<path d="M5.5 11q3 3 6 0" fill="none" stroke="#000"/>`;
  return `<svg viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="7.5" fill="#ffff00" stroke="#000"/>${eyes}${mouth}</svg>`;
}
const FLAG = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M2 10h8v1H2zM4 9h4v1H4zM6 2h1v7H6z"/><path d="M6 1v5L2 3.5z" fill="#f00"/></svg>')}")`;

function minesHtml() {
  return `<div class="menubar">
      <button class="mbtn" type="button" data-mm aria-haspopup="menu" aria-expanded="false"><u>G</u>ame</button>
      <div class="drop" role="menu" hidden>
        <button type="button" role="menuitem" data-ms="new"><span></span><span>Nouvelle partie</span><kbd>F2</kbd></button><hr>
        ${LEVELS.map((L, i) => `<button type="button" role="menuitemradio" data-ms="lvl" data-l="${i}"><span class="ck"></span><span>${L.name}</span><span></span></button>`).join("")}<hr>
        <button type="button" role="menuitem" data-ms="best"><span></span><span>Meilleurs temps…</span><span></span></button><hr>
        <button type="button" role="menuitem" data-ms="quit"><span></span><span>Quitter</span><span></span></button>
      </div>
    </div>
    <div class="ms">
      <div class="ms-top"><div class="led" data-led="left" aria-label="Mines restantes"></div><button class="face" type="button" aria-label="Nouvelle partie"></button><div class="led" data-led="time" aria-label="Temps"></div></div>
      <div class="ms-wrap"><div class="grid" role="grid" aria-label="Champ de mines"></div></div>
    </div>
    <div class="mspanel" hidden><div></div></div>`;
}

function initMines(el) {
  const $m = s => el.querySelector(s), grid = $m(".grid"), face = $m(".face"), ms = $m(".ms"), drop = $m(".drop"), mbtn = $m("[data-mm]"), panel = $m(".mspanel");
  ms.style.setProperty("--flag", FLAG); ms.style.setProperty("--mine", `url("${ICON.mine16}")`);
  const BEST = "h97-mines-best";
  const best = () => { try { return JSON.parse(localStorage.getItem(BEST)) || {}; } catch { return {}; } };
  let lvl = Math.min(2, Math.max(0, +LS.get("h97-mines-level") || 0));
  let R, C, M, mine, open, flag, cnt, state, opened, flags, t0, timer, secs, pressed = null;

  const N = i => { const r = Math.floor(i / C), c = i % C, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(rr * C + cc); }
    return out; };
  const setFace = m => { face.innerHTML = faceSvg(m); };
  const setLeft = () => { $m("[data-led=left]").innerHTML = led(M - flags); };
  const setTime = () => { $m("[data-led=time]").innerHTML = led(secs); };

  function newGame(l = lvl) {
    lvl = l; LS.set("h97-mines-level", String(l));
    ({ rows: R, cols: C, mines: M } = LEVELS[l]);
    mine = new Uint8Array(R * C); open = new Uint8Array(R * C); flag = new Uint8Array(R * C); cnt = new Uint8Array(R * C);
    state = "ready"; opened = 0; flags = 0; secs = 0; clearInterval(timer);
    ms.className = "ms l" + l; grid.style.setProperty("--cols", C);
    grid.innerHTML = Array.from({ length: R * C }, (_, i) => `<div class="cell" data-i="${i}" role="gridcell"></div>`).join("");
    drop.querySelectorAll("[data-ms=lvl]").forEach(b => { b.querySelector(".ck").textContent = +b.dataset.l === l ? "✓" : ""; b.setAttribute("aria-checked", String(+b.dataset.l === l)); });
    setFace("smile"); setLeft(); setTime(); place(); fit();
  }
  function fit() { // fenêtre agrandie : les cases grossissent pour remplir l’écran
    if (!el.classList.contains("max")) { ms.style.removeProperty("--c"); return; }
    ms.style.setProperty("--c", "16px");
    const top = $m(".ms-top").offsetHeight + 6, availW = ms.clientWidth - 24, availH = ms.clientHeight - top - 26;
    const c = Math.max(16, Math.min(64, Math.floor(Math.min(availW / C, availH / R))));
    ms.style.setProperty("--c", c + "px");
  }
  new MutationObserver(() => { fit(); if (!el.classList.contains("max")) place(); }).observe(el, { attributes: true, attributeFilter: ["class"] });
  addEventListener("resize", () => { if (wins.mines && wins.mines.el === el) fit(); });
  function place() { // recentre la fenêtre quand sa taille change
    if (el.classList.contains("max")) return;
    const W = innerWidth, H = innerHeight - 30, w = el.offsetWidth, h = el.offsetHeight;
    if (el.dataset.placed) { el.style.left = Math.max(2, Math.min(el.offsetLeft, W - w - 2)) + "px"; el.style.top = Math.max(2, Math.min(el.offsetTop, H - h - 2)) + "px"; return; }
    el.dataset.placed = "1"; el.style.left = Math.max(2, (W - w) / 2) + "px"; el.style.top = Math.max(2, (H - h) / 2 - 20) + "px";
  }
  function lay(safe) {
    const banned = new Set([safe, ...N(safe)]), free = [];
    for (let i = 0; i < R * C; i++) if (!banned.has(i)) free.push(i);
    for (let k = 0; k < M; k++) { const j = k + Math.floor(Math.random() * (free.length - k)); [free[k], free[j]] = [free[j], free[k]]; mine[free[k]] = 1; }
    for (let i = 0; i < R * C; i++) cnt[i] = N(i).reduce((s, j) => s + mine[j], 0);
    state = "play"; t0 = Date.now(); secs = 1; setTime();
    timer = setInterval(() => { secs = Math.min(999, Math.floor((Date.now() - t0) / 1000) + 1); setTime(); }, 250);
  }
  const cellEl = i => grid.children[i];
  function paintCell(i) {
    const e = cellEl(i); e.className = "cell"; e.textContent = "";
    if (open[i]) { e.classList.add("open"); if (cnt[i]) { e.textContent = cnt[i]; e.classList.add("n" + cnt[i]); } }
    else if (flag[i]) e.classList.add("flag");
  }
  function reveal(i) {
    if (open[i] || flag[i]) return;
    if (mine[i]) return lose(i);
    const stack = [i];
    while (stack.length) {
      const k = stack.pop(); if (open[k] || flag[k]) continue;
      open[k] = 1; opened++; paintCell(k);
      if (!cnt[k]) N(k).forEach(j => { if (!open[j] && !mine[j]) stack.push(j); });
    }
    if (opened === R * C - M) win();
  }
  function chord(i) {
    if (!open[i] || !cnt[i]) return;
    const nb = N(i); if (nb.reduce((s, j) => s + flag[j], 0) !== cnt[i]) return;
    for (const j of nb) { if (state !== "play") break; if (!flag[j] && !open[j]) reveal(j); }
  }
  function toggleFlag(i) {
    if (open[i] || state === "over" || state === "won") return;
    flag[i] ^= 1; flags += flag[i] ? 1 : -1; paintCell(i); setLeft();
  }
  function lose(i) {
    state = "over"; clearInterval(timer); setFace("dead");
    for (let k = 0; k < R * C; k++) {
      const e = cellEl(k);
      if (mine[k] && !flag[k]) { e.className = "cell open mine"; e.textContent = ""; }
      else if (!mine[k] && flag[k]) { e.className = "cell open wrong"; e.textContent = ""; }
    }
    cellEl(i).classList.add("boom");
  }
  function win() {
    state = "won"; clearInterval(timer); setFace("cool");
    for (let k = 0; k < R * C; k++) if (mine[k] && !flag[k]) { flag[k] = 1; paintCell(k); }
    flags = M; setLeft();
    const b = best(), key = LEVELS[lvl].name;
    if (!b[key] || secs < b[key].t) askName(key, secs);
  }
  function askName(key, t) {
    panel.firstElementChild.innerHTML = `<h4>Nouveau record en niveau ${key} : ${t} s</h4><label for="msName">Ton nom :</label><input type="text" id="msName" maxlength="20" value="${esc(LS.get("h97-mines-name") || "Anonyme")}"><div class="btns"><button class="btn default" type="button" data-p="save">OK</button></div>`;
    panel.hidden = false; const inp = panel.querySelector("#msName"); inp.select();
    const save = () => { const n = inp.value.trim() || "Anonyme"; LS.set("h97-mines-name", n); const b = best(); b[key] = { t, n }; try { localStorage.setItem(BEST, JSON.stringify(b)); } catch {} showBest(); };
    panel.querySelector("[data-p=save]").onclick = save; inp.onkeydown = e => { if (e.key === "Enter") save(); };
  }
  function showBest() {
    const b = best();
    panel.firstElementChild.innerHTML = `<h4>Meilleurs temps</h4><table>${LEVELS.map(L => `<tr><td>${L.name} :</td><td>${b[L.name] ? b[L.name].t + " s" : "999 s"}</td><td>${b[L.name] ? esc(b[L.name].n) : "Anonyme"}</td></tr>`).join("")}</table>
      <div class="btns"><button class="btn" type="button" data-p="reset">Réinitialiser</button><button class="btn default" type="button" data-p="ok">OK</button></div>`;
    panel.hidden = false;
    panel.querySelector("[data-p=ok]").onclick = () => { panel.hidden = true; };
    panel.querySelector("[data-p=reset]").onclick = () => { try { localStorage.removeItem(BEST); } catch {} showBest(); };
  }

  /* souris et doigt */
  let lp = null, lpDone = false, both = false, downBtns = 0;
  const idx = e => { const c = e.target.closest(".cell"); return c ? +c.dataset.i : -1; };
  const press = i => { unpress(); if (i < 0 || state === "over" || state === "won") return; const list = (both || (open[i] && cnt[i])) ? [i, ...N(i)] : [i]; pressed = list.filter(k => !open[k] && !flag[k]); pressed.forEach(k => cellEl(k).classList.add("down")); setFace("oh"); };
  const unpress = () => { if (pressed) pressed.forEach(k => cellEl(k).classList.remove("down")); pressed = null; };
  grid.addEventListener("contextmenu", e => e.preventDefault());
  grid.addEventListener("pointerdown", e => {
    if (state === "over" || state === "won") return;
    const i = idx(e); if (i < 0) return;
    downBtns = e.buttons; both = (e.buttons & 3) === 3 || e.button === 1;
    if (e.pointerType === "mouse" && e.button === 2 && !(e.buttons & 1)) { toggleFlag(i); return; }
    if (e.pointerType !== "mouse") { lpDone = false; clearTimeout(lp); lp = setTimeout(() => { lpDone = true; unpress(); setFace("smile"); toggleFlag(i); if (navigator.vibrate) navigator.vibrate(30); }, 380); }
    try { e.target.releasePointerCapture(e.pointerId); } catch {}
    press(i);
  });
  grid.addEventListener("pointerover", e => { if (pressed && e.buttons) press(idx(e)); });
  grid.addEventListener("pointerleave", () => { unpress(); clearTimeout(lp); if (state === "ready" || state === "play") setFace("smile"); });
  grid.addEventListener("pointercancel", () => { unpress(); clearTimeout(lp); setFace("smile"); });
  grid.addEventListener("pointerup", e => {
    clearTimeout(lp);
    const i = idx(e), wasBoth = both || (downBtns & 3) === 3; both = false;
    if (!pressed) { if (state !== "over" && state !== "won") setFace("smile"); return; }
    unpress(); if (state === "ready" || state === "play") setFace("smile");
    if (i < 0 || lpDone) return;
    if (e.pointerType === "mouse" && e.button === 2 && !wasBoth) return;
    if (state === "ready") { if (flag[i]) return; lay(i); }
    if (wasBoth || open[i]) chord(i); else reveal(i);
  });
  face.addEventListener("click", () => newGame());

  /* menu Game */
  const closeDrop = () => { drop.hidden = true; mbtn.setAttribute("aria-expanded", "false"); };
  mbtn.addEventListener("click", () => { const o = drop.hidden; drop.hidden = !o; mbtn.setAttribute("aria-expanded", String(o)); });
  document.addEventListener("pointerdown", e => { if (!drop.hidden && !drop.contains(e.target) && e.target !== mbtn) closeDrop(); });
  drop.addEventListener("click", e => {
    const b = e.target.closest("[data-ms]"); if (!b) return; closeDrop();
    if (b.dataset.ms === "new") newGame();
    else if (b.dataset.ms === "lvl") newGame(+b.dataset.l);
    else if (b.dataset.ms === "best") showBest();
    else if (b.dataset.ms === "quit") closeWin("mines");
  });
  el._keys = e => { if (e.key === "F2") { e.preventDefault(); newGame(); } };
  newGame();
}
document.addEventListener("keydown", e => { const w = wins.mines; if (w && w.el.classList.contains("active") && !w.el.hidden && w.el._keys) w.el._keys(e); });

function solSlices() { // découpe la planche une seule fois : chaque carte devient une petite image, bien plus rapide à afficher
  if (SOL_SLICES) return SOL_SLICES;
  const cut = (cx, cy) => { const c = document.createElement("canvas"); c.width = 71; c.height = 96; c.getContext("2d").drawImage(SOL_IMG, cx * 71, cy * 96, 71, 96, 0, 0, 71, 96); return `url("${c.toDataURL()}")`; };

  return SOL_SLICES;
}

}

function initSol(el) {
  const felt = el.querySelector(".felt"), st1 = el.querySelector(".st1"), st2 = el.querySelector(".st2");
  /* Options (fenêtre « Options… ») : mémorisées dans ce navigateur. Anciennes versions : on reprend l'ancien niveau. */
  const OPT_KEY = "h97-sol-opts", VKEY = "h97-sol-vegas";
  const opts = (() => {
    let o = {}; try { o = JSON.parse(LS.get(OPT_KEY)) || {}; } catch {}
    const old = LS.get("h97-sol-level"), lv = old === "" ? 1 : Math.min(2, Math.max(0, +old || 0));
    const d = { draw: lv === 0 ? 1 : 3, level: lv, scoring: "standard", timed: true, statusbar: true, outline: false, keep: false };
    const r = { ...d, ...o };
    r.draw = r.draw === 1 ? 1 : 3; r.level = Math.min(2, Math.max(0, +r.level || 0));
    if (!["standard", "vegas", "none"].includes(r.scoring)) r.scoring = "standard";
    ["timed", "statusbar", "outline", "keep"].forEach(k => { r[k] = !!r[k]; });
    return r;
  })();
  const saveOpts = () => LS.set(OPT_KEY, JSON.stringify(opts));
  let rules = { draw: opts.draw, level: opts.level, scoring: opts.scoring };   // règles de la partie en cours
  let vt = +LS.get(VKEY) || 0;                                                // total Vegas conservé
  let back = Math.min(SOL_BACKS.length - 1, Math.max(0, +LS.get("h97-sol-back") || 0));
  let G, hist = [], timer = null, secs = 0, started = false, won = false, anim = null, lastTap = null;
  let D = { w: 71, h: 96 }; const pos = [];
  const L = () => SOL_LEVELS[rules.level];
  const maxRecycles = () => { let m = L().recycles; if (rules.scoring === "vegas") m = Math.min(m, rules.draw === 1 ? 0 : 2); return m; };
  const money = n => (n < 0 ? "-$" : "$") + Math.abs(n);
  felt.style.setProperty("--sheet", `url("${SOL_SHEET}")`);
  const setBack = () => { if (SOL_SLICES) felt.style.setProperty("--back", SOL_SLICES.backs[back]); };

  /* éléments : emplacements vides et 52 cartes */
  const mkSlot = cls => { const d = document.createElement("div"); d.className = "slot " + cls; felt.appendChild(d); return d; };
  const slotStock = mkSlot("stock"), slotF = [0, 1, 2, 3].map(() => mkSlot("fnd")), slotT = [0, 1, 2, 3, 4, 5, 6].map(() => mkSlot("tbl"));
  const C = [];
  for (let id = 0; id < 52; id++) {
    const e = document.createElement("div");
    e.className = "pc"; e.dataset.id = id;
    felt.appendChild(e); C.push(e);
  }

  const skin = () => { const S = solSlices(); C.forEach((e, id) => { e.style.backgroundImage = S.face[id]; }); felt.style.setProperty("--o", S.o); felt.style.setProperty("--x", S.x); setBack(); };
  if (SOL_IMG.complete && SOL_IMG.naturalWidth) skin(); else SOL_IMG.decode().then(skin).catch(() => { SOL_IMG.onload = skin; });

  /* état */
  const snap = () => JSON.stringify(G);
  function deal() {
    stopAnim(); closePanel(); rules = { draw: opts.draw, level: opts.level, scoring: opts.scoring }; syncMenu();
    const ids = [...Array(52).keys()];
    for (let i = 51; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    G = { stock: [], waste: [], f: [[], [], [], []], t: [[], [], [], [], [], [], []], up: Array(52).fill(0), score: rules.scoring === "vegas" ? -52 : 0, recycles: 0 };
    if (rules.scoring === "vegas" && opts.keep) { vt += -52; LS.set(VKEY, String(vt)); }
    for (let c = 0; c < 7; c++) for (let k = 0; k <= c; k++) G.t[c].push(ids.pop());
    G.t.forEach(p => { G.up[p[p.length - 1]] = 1; });
    G.stock = ids; hist = []; secs = 0; started = false; won = false; clearInterval(timer); timer = null;
    C.forEach(c => { c.style.visibility = ""; });
    felt.classList.add("nofx"); layout(); requestAnimationFrame(() => felt.classList.remove("nofx"));
    status(`${L().name} : ` + (matchMedia("(pointer:coarse)").matches ? "touche une carte pour la jouer, ou fais-la glisser" : "glisse les cartes, double-clic pour les envoyer sur les As"));
  }
  const find = id => {
    if (G.stock.includes(id)) return { p: "stock", a: G.stock };
    if (G.waste.includes(id)) return { p: "waste", a: G.waste };
    for (let i = 0; i < 4; i++) if (G.f[i].includes(id)) return { p: "f", i, a: G.f[i] };
    for (let i = 0; i < 7; i++) if (G.t[i].includes(id)) return { p: "t", i, a: G.t[i] };
  };
  const top = a => a[a.length - 1];
  const canF = (id, i) => { const p = G.f[i]; return p.length ? sOf(top(p)) === sOf(id) && rOf(id) === rOf(top(p)) + 1 : rOf(id) === 1; };
  const canT = (id, i) => { const p = G.t[i]; return p.length ? G.up[top(p)] && redOf(top(p)) !== redOf(id) && rOf(top(p)) === rOf(id) + 1 : rOf(id) === 13; };
  const add = n => {
    if (rules.scoring === "none") return;
    if (rules.scoring === "vegas") { G.score += n; if (opts.keep) { vt += n; LS.set(VKEY, String(vt)); } return; }
    G.score = Math.max(0, G.score + n);
  };
  const remember = () => { if (L().undo === 0) return; hist.push(snap()); while (hist.length > Math.min(L().undo, 300)) hist.shift(); };
  function startClock() {
    started = true; if (!opts.timed || timer || won) return;
    timer = setInterval(() => { if (won) return; secs++; if (rules.scoring === "standard" && secs % 10 === 0) add(-2); status(); }, 1000);
  }
  function scoreText() {
    if (rules.scoring === "none") return "";
    if (rules.scoring === "vegas") return "Score : " + money(opts.keep ? vt : G.score);
    return "Score : " + G.score;
  }
  function status(hint) { if (hint !== undefined) st1.textContent = hint; st2.textContent = [scoreText(), opts.timed ? "Temps : " + secs : ""].filter(Boolean).join("  "); }

  function move(ids, from, toP, toI) {
    remember(); startClock();
    from.a.splice(from.a.length - ids.length, ids.length);
    (toP === "f" ? G.f[toI] : G.t[toI]).push(...ids);
    if (rules.scoring === "vegas") { if (toP === "f") add(5); else if (from.p === "f") add(-5); }
    else if (from.p === "waste") add(toP === "f" ? 10 : 5);
    else if (from.p === "t" && toP === "f") add(10);
    else if (from.p === "f" && toP === "t") add(-15);
    if (from.p === "t" && from.a.length && !G.up[top(from.a)]) { G.up[top(from.a)] = 1; if (rules.scoring === "standard") add(5); }
    layout(); status(); checkWin();
  }
  function stockClick() {
    if (G.stock.length) {
      remember(); startClock();
      for (let k = 0; k < rules.draw && G.stock.length; k++) { const id = G.stock.pop(); G.up[id] = 1; G.waste.push(id); }
    } else if (G.waste.length) {
      if (G.recycles >= maxRecycles()) { status("Plus de passage possible dans le talon"); return; }
      remember(); startClock();
      while (G.waste.length) { const id = G.waste.pop(); G.up[id] = 0; G.stock.push(id); }
      G.recycles++; if (rules.scoring === "standard") add(rules.draw === 1 ? -100 : -20);
    } else return;
    layout(); status();
  }
  function undo() {
    if (won) return;
    if (L().undo === 0) { status("L’annulation est désactivée en Difficile"); return; }
    if (!hist.length) return;
    const prev = JSON.parse(hist.pop()), diff = prev.score - G.score; G = prev;
    if (rules.scoring === "vegas" && opts.keep && diff) { vt += diff; LS.set(VKEY, String(vt)); }
    layout(); status();
  }
  function toFound(id) {
    const from = find(id); if (!from || from.p === "stock" || from.p === "f" || top(from.a) !== id || !G.up[id]) return false;
    for (let i = 0; i < 4; i++) if (canF(id, i)) { move([id], from, "f", i); return true; }
    return false;
  }
  function autoAll() { let moved = true; while (moved && !won) { moved = false; const tops = [top(G.waste), ...G.t.map(top)].filter(x => x !== undefined); for (const id of tops) if (toFound(id)) { moved = true; break; } } }
  function smart(id) {
    const from = find(id); if (!from || !G.up[id]) return;
    if (top(from.a) === id && from.p !== "f" && toFound(id)) return;
    const ids = from.a.slice(from.a.indexOf(id));
    const order = [...Array(7).keys()].sort((a, b) => (G.t[b].length > 0) - (G.t[a].length > 0));
    for (const i of order) {
      if (from.p === "t" && from.i === i) continue;
      if (rOf(id) === 13 && from.p === "t" && from.a.indexOf(id) === 0 && !G.t[i].length) continue;
      if (canT(id, i)) return move(ids, from, "t", i);
    }
  }

  /* placement : cartes à leur taille d’origine (ou ×2) dès que la place le permet */
  function layout() {
    const W = felt.clientWidth, H = felt.clientHeight; if (!W || !H) return;
    const pad = Math.max(6, Math.round(W * .015));
    let w = Math.floor((W - 2 * pad) / (7 + 6 * .12)); w = Math.max(28, Math.min(w, Math.floor((H - 2 * pad) / 2.6 * 71 / 96)));
    const crisp = w >= 71; if (crisp) w = Math.min(142, 71 * Math.floor(w / 71));
    const h = Math.round(w * 96 / 71), gx = (W - 2 * pad - 7 * w) / 6, X = c => Math.round(pad + c * (w + gx));
    const y0 = pad, y1 = y0 + h + Math.max(pad, Math.round(h * .18));
    D = { w, h, X, y0, y1, pad, W, H, crisp };
    felt.style.setProperty("--w", w + "px"); felt.style.setProperty("--h", h + "px"); felt.classList.toggle("crisp", crisp);
    const place = (e, x, y) => { e.style.left = x + "px"; e.style.top = y + "px"; };
    place(slotStock, X(0), y0); slotF.forEach((e, i) => place(e, X(3 + i), y0)); slotT.forEach((e, i) => place(e, X(i), y1));
    slotStock.classList.toggle("x", !G.stock.length && (G.recycles >= maxRecycles() || !G.waste.length));
    let z = 1;
    const put = (id, x, y, up) => { const e = C[id]; e.style.transform = `translate(${x}px,${y}px)`; e.style.zIndex = z++; e.classList.toggle("back", !up); pos[id] = { x, y }; };
    G.stock.forEach((id, k) => put(id, X(0) + Math.floor(k / 8) * 2, y0 - Math.floor(k / 8) * 2, 0));
    const wl = G.waste.length, fan = rules.draw === 3 ? Math.min(3, wl) : 1;
    G.waste.forEach((id, k) => { const vis = k - (wl - fan); put(id, X(1) + (vis > 0 ? vis * Math.round(w * .2) : 0), y0, 1); });
    G.f.forEach((p, i) => p.forEach(id => put(id, X(3 + i), y0, 1)));
    G.t.forEach((p, c) => {
      const nd = p.filter(id => !G.up[id]).length, nu = p.length - nd;
      let dO = Math.max(3, Math.round(h * .09)), uO = Math.round(h * .26);
      const need = nd * dO + Math.max(0, nu - 1) * uO, avail = H - y1 - pad - h;
      if (need > avail && need > 0) { const k = Math.max(.25, avail / need); dO *= k; uO *= k; }
      let y = y1; p.forEach(id => { put(id, X(c), Math.round(y), G.up[id]); y += G.up[id] ? uO : dO; });
    });
  }

  /* souris et doigt */
  let drag = null;
  felt.addEventListener("contextmenu", e => { e.preventDefault(); if (!won && !anim) autoAll(); });
  felt.addEventListener("pointerdown", e => {
    if (anim) { finishAnim(); return; }
    if (won || e.button > 0 || el.querySelector(".solmsg")) return;
    const ce = e.target.closest(".pc"), slot = e.target.closest(".slot");
    if (!ce) { if (slot === slotStock) drag = { stock: true, sx: e.clientX, sy: e.clientY }; return; }
    const id = +ce.dataset.id, from = find(id);
    if (from.p === "stock") { drag = { stock: true, sx: e.clientX, sy: e.clientY }; return; }
    if (!G.up[id]) return;
    const idx = from.a.indexOf(id);
    if (from.p !== "t" && idx !== from.a.length - 1) return;
    drag = { id, from, ids: from.a.slice(idx), sx: e.clientX, sy: e.clientY, moved: false, type: e.pointerType, pid: e.pointerId };
  });
  felt.addEventListener("pointermove", e => {
    if (!drag || drag.stock) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) {
      drag.moved = true; try { felt.setPointerCapture(drag.pid); } catch {}
      if (opts.outline) {   // option « Déplacement par contour » : seule une silhouette suit la souris, les cartes restent en place
        const a = pos[drag.ids[0]], z = pos[drag.ids[drag.ids.length - 1]], f = document.createElement("div");
        f.className = "dragframe thin"; f.style.width = D.w + "px"; f.style.height = (z.y - a.y + D.h) + "px"; f.style.transform = "translate(-9999px,-9999px)";
        document.body.appendChild(f); drag.frame = f; drag.fa = a;
      } else drag.ids.forEach((id, k) => { C[id].classList.add("drag"); C[id].style.zIndex = 900 + k; });
    }
    drag.dx = dx; drag.dy = dy;
    if (drag.raf) return;
    const d = drag;
    d.raf = requestAnimationFrame(() => {
      d.raf = 0;
      if (d.frame) { const r = felt.getBoundingClientRect(); d.frame.style.transform = `translate(${r.left + d.fa.x + d.dx}px,${r.top + d.fa.y + d.dy}px)`; return; }
      d.ids.forEach((id, k) => { C[id].style.transform = `translate(${pos[id].x + d.dx}px,${pos[id].y + d.dy}px)`; C[id].style.zIndex = 900 + k; });
    });
  });
  const endDrag = e => {
    const d = drag; drag = null; if (!d) return;
    if (d.raf) { cancelAnimationFrame(d.raf); d.raf = 0; }
    if (d.frame) d.frame.remove();
    if (d.stock) { if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 8) stockClick(); return; }
    d.ids.forEach(id => C[id].classList.remove("drag"));
    if (!d.moved) {
      if (d.type !== "mouse") { smart(d.id); return; }
      // double-clic détecté ici : fiable même quand la carte bouge entre les deux clics
      const now = Date.now();
      if (lastTap && lastTap.id === d.id && now - lastTap.t < 450) { lastTap = null; toFound(d.id); }
      else lastTap = { id: d.id, t: now };
      return;
    }
    const p0 = pos[d.id], Lx = p0.x + d.dx, T = p0.y + d.dy, R = Lx + D.w, B = T + D.h;
    const ov = (x1, y1, x2, y2) => Math.max(0, Math.min(R, x2) - Math.max(Lx, x1)) * Math.max(0, Math.min(B, y2) - Math.max(T, y1));
    let best = null, bestA = 0;
    if (d.ids.length === 1) for (let i = 0; i < 4; i++) { const a = ov(D.X(3 + i), D.y0, D.X(3 + i) + D.w, D.y0 + D.h); if (a > bestA && canF(d.id, i)) { best = ["f", i]; bestA = a; } }
    for (let i = 0; i < 7; i++) {
      if (d.from.p === "t" && d.from.i === i) continue;
      const tp = top(G.t[i]), yb = tp !== undefined ? pos[tp].y + D.h : D.y1 + D.h;
      const a = ov(D.X(i), D.y1 - D.h * .3, D.X(i) + D.w, yb + D.h * .3); if (a > bestA && canT(d.id, i)) { best = ["t", i]; bestA = a; }
    }
    if (best) move(d.ids, d.from, best[0], best[1]); else layout();
  };
  felt.addEventListener("pointerup", endDrag);
  felt.addEventListener("pointercancel", () => { if (drag && drag.frame) drag.frame.remove(); if (drag && !drag.stock) drag.ids.forEach(id => C[id].classList.remove("drag")); drag = null; layout(); });

  /* victoire : la célèbre cascade de cartes */
  function checkWin() {
    if (G.f.some(p => p.length < 13)) return;
    won = true; clearInterval(timer); timer = null;
    if (rules.scoring === "standard" && opts.timed && secs >= 30) G.score += Math.floor(700000 / secs);
    status("Gagné ! Clique pour passer l’animation"); cascade();
  }
  function cascade() {
    const cv = document.createElement("canvas"), r = devicePixelRatio || 1; cv.className = "solcv";
    cv.width = D.W * r; cv.height = D.H * r; felt.appendChild(cv);
    const g = cv.getContext("2d"); g.scale(r, r); g.imageSmoothingEnabled = !D.crisp;
    const queue = []; for (let rank = 13; rank >= 1; rank--) for (let i = 0; i < 4; i++) queue.push({ id: G.f[i][rank - 1], i });
    let cur = null; const s = D.w / 71;
    anim = { cv, raf: 0 };
    const next = () => {
      const q = queue.shift(); if (!q) return finishAnim();
      C[q.id].style.visibility = "hidden";
      cur = { id: q.id, x: D.X(3 + q.i), y: D.y0, vx: (Math.random() < .5 ? -1 : 1) * (2 + Math.random() * 5) * s, vy: -Math.random() * 7 * s };
    };
    next();
    const step = () => {
      if (!anim) return;
      for (let k = 0; k < 2 && cur; k++) {
        cur.vy += .45 * s; cur.x += cur.vx; cur.y += cur.vy;
        if (cur.y + D.h > D.H) { cur.y = D.H - D.h; cur.vy = -cur.vy * .78; }
        g.drawImage(SOL_IMG, (rOf(cur.id) - 1) * 71, sOf(cur.id) * 96, 71, 96, Math.round(cur.x), Math.round(cur.y), D.w, D.h);
        if (cur.x + D.w < 0 || cur.x > D.W) next();
      }
      if (anim) anim.raf = requestAnimationFrame(step);
    };
    anim.raf = requestAnimationFrame(step);
  }
  function stopAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim.cv.remove(); anim = null; } }
  function finishAnim() {
    stopAnim();
    G.f.flat().forEach(id => { C[id].style.visibility = "hidden"; });
    panel("Solitaire", `<p>Bravo, tu as gagné (${L().name}) !<br>${[scoreText(), opts.timed ? "Temps : " + secs + " s" : ""].filter(Boolean).join(" · ")}</p><p>Une autre partie ?</p>`,
      [["Oui", () => deal(), true], ["Non", () => { G.f.flat().forEach(id => { C[id].style.visibility = ""; }); status("Partie terminée"); }]]);
  }

  /* boîtes de dialogue dans la fenêtre */
  function closePanel() { el.querySelectorAll(".solmsg").forEach(m => m.remove()); }
  function panel(title, html, buttons, cls = "") {
    closePanel();
    const m = document.createElement("div"); m.className = "solmsg " + cls;
    m.innerHTML = `<h4>${title}<button class="tbtn x" type="button" aria-label="Fermer"><svg width="8" height="7" viewBox="0 0 8 7"><path d="M0 0h2l2 2 2-2h2L5 3.5 8 7H6L4 5 2 7H0l3-3.5z"/></svg></button></h4><div class="sb">${html}</div><div class="btns">${buttons.map((b, i) => `<button class="btn${b[2] ? " default" : ""}" type="button" data-b="${i}">${b[0]}</button>`).join("")}</div>`;
    felt.appendChild(m);
    m.querySelector(".tbtn").onclick = () => m.remove();
    m.querySelectorAll("[data-b]").forEach(b => { b.onclick = () => { const r = buttons[+b.dataset.b][1](m); if (r !== false) m.remove(); }; });
    return m;
  }
  function chooseBack() {
    let pick = back;
    const m = panel("Choisir le dos des cartes", `<div class="backs">${SOL_BACKS.map((b, i) => `<button type="button" class="bk${i === back ? " on" : ""}" data-k="${i}" style="--bx:${b[0]};--by:${b[1]}" aria-label="Dos ${i + 1}"></button>`).join("")}</div>`,
      [["OK", () => { back = pick; LS.set("h97-sol-back", String(back)); setBack(); }, true], ["Annuler", () => {}]], "wide");
    m.querySelector(".backs").addEventListener("click", e => { const b = e.target.closest(".bk"); if (!b) return; pick = +b.dataset.k; m.querySelectorAll(".bk").forEach(x => x.classList.toggle("on", x === b)); });
    m.querySelector(".backs").addEventListener("dblclick", e => { if (e.target.closest(".bk")) m.querySelector("[data-b='0']").click(); });
  }
  /* Fenêtre « Options » comme sous Windows 98 */
  function openOptions() {
    const radios = (name, items, cur) => items.map(([v, t]) => `<label><input type="radio" name="${name}" value="${v}"${String(cur) === String(v) ? " checked" : ""}>${t}</label>`).join("");
    const chk = (id, t, on) => `<label class="ck"><input type="checkbox" id="${id}"${on ? " checked" : ""}>${t}</label>`;
    const get = (mm, name) => mm.querySelector(`input[name=${name}]:checked`).value;
    const m = panel("Options", `
      <div class="og2">
        <fieldset><legend>Tirage</legend>${radios("od", [[1, "Tirer une carte"], [3, "Tirer trois cartes"]], opts.draw)}</fieldset>
        <fieldset><legend>Score</legend>${radios("os", [["standard", "Standard"], ["vegas", "Vegas"], ["none", "Aucun"]], opts.scoring)}</fieldset>
      </div>
      <fieldset><legend>Difficulté</legend><div class="og3">${radios("ol", SOL_LEVELS.map((x, i) => [i, x.name]), opts.level)}</div><p class="oh"></p></fieldset>
      ${chk("oTimed", "Partie chronométrée", opts.timed)}${chk("oBar", "Barre d’état", opts.statusbar)}${chk("oOut", "Déplacement par contour", opts.outline)}${chk("oKeep", "Conserver le score", opts.keep)}`,
      [["OK", mm => {
        const n = { draw: +get(mm, "od") === 1 ? 1 : 3, scoring: get(mm, "os"), level: +get(mm, "ol"), timed: mm.querySelector("#oTimed").checked, statusbar: mm.querySelector("#oBar").checked, outline: mm.querySelector("#oOut").checked, keep: mm.querySelector("#oKeep").checked };
        if (n.keep && !opts.keep && rules.scoring === "vegas") { vt = (+LS.get(VKEY) || 0) + G.score; LS.set(VKEY, String(vt)); }
        const changed = n.draw !== rules.draw || n.level !== rules.level || n.scoring !== rules.scoring;
        Object.assign(opts, n); saveOpts(); applyDisplay();
        if (changed) { if (!started) deal(); else status("Les nouveaux réglages de tirage, de score et de difficulté s’appliqueront à la prochaine partie (F2)."); }
      }, true], ["Annuler", () => {}]], "opts");
    const sync = () => {
      const k = m.querySelector("#oKeep"), v = get(m, "os") === "vegas";
      k.disabled = !v; k.closest("label").classList.toggle("dis", !v);
      m.querySelector(".oh").textContent = SOL_LEVELS[+get(m, "ol")].txt;
    };
    m.addEventListener("change", sync); sync();

  box.addEventListener("click", async e => {
