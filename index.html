function initSol(el) {
  const felt = el.querySelector(".felt"), st1 = el.querySelector(".st1"), st2 = el.querySelector(".st2");
  /* Options (fenêtre « Options… ») : mémorisées dans ce navigateur. Anciennes versions : on reprend l'ancien niveau. */
  const OPT_KEY = "h97-sol-opts", VKEY = "h97-sol-vegas";
  const opts = (() => {
    let o = {}; try { o = JSON.parse(LS.get(OPT_KEY)) || {}; } catch {}
    const old = LS.get("h97-sol-level"), lv = old === "" ? 1 : Math.min(2, Math.max(0, +old || 0));
    const d = { draw: lv === 0 ? 1 : 3, level: lv, scoring: "standard", timed: true, statusbar: true, outline: false, keep: false };
    const r = { ...d, ...o };
    r.draw = r.draw === 1 ? 1 : 3; r.level = Math.min(2, Math.max(0, +r.level || 0));
    if (!["standard", "vegas", "none"].includes(r.scoring)) r.scoring = "standard";
    ["timed", "statusbar", "outline", "keep"].forEach(k => { r[k] = !!r[k]; });
    return r;
  })();
  const saveOpts = () => LS.set(OPT_KEY, JSON.stringify(opts));
  let rules = { draw: opts.draw, level: opts.level, scoring: opts.scoring };   // règles de la partie en cours
  let vt = +LS.get(VKEY) || 0;                                                // total Vegas conservé
  let back = Math.min(SOL_BACKS.length - 1, Math.max(0, +LS.get("h97-sol-back") || 0));
  let G, hist = [], timer = null, secs = 0, started = false, won = false, anim = null, lastTap = null;
  let D = { w: 71, h: 96 }; const pos = [];
  const L = () => SOL_LEVELS[rules.level];
  const maxRecycles = () => { let m = L().recycles; if (rules.scoring === "vegas") m = Math.min(m, rules.draw === 1 ? 0 : 2); return m; };
  const money = n => (n < 0 ? "-$" : "$") + Math.abs(n);
  felt.style.setProperty("--sheet", `url("${SOL_SHEET}")`);
  const setBack = () => { if (SOL_SLICES) felt.style.setProperty("--back", SOL_SLICES.backs[back]); };

  /* éléments : emplacements vides et 52 cartes */
  const mkSlot = cls => { const d = document.createElement("div"); d.className = "slot " + cls; felt.appendChild(d); return d; };
  const slotStock = mkSlot("stock"), slotF = [0, 1, 2, 3].map(() => mkSlot("fnd")), slotT = [0, 1, 2, 3, 4, 5, 6].map(() => mkSlot("tbl"));
  const C = [];
  for (let id = 0; id < 52; id++) {
    const e = document.createElement("div");
    e.className = "pc"; e.dataset.id = id;
    felt.appendChild(e); C.push(e);
  }

  const skin = () => { const S = solSlices(); C.forEach((e, id) => { e.style.backgroundImage = S.face[id]; }); felt.style.setProperty("--o", S.o); felt.style.setProperty("--x", S.x); setBack(); };
  if (SOL_IMG.complete && SOL_IMG.naturalWidth) skin(); else SOL_IMG.decode().then(skin).catch(() => { SOL_IMG.onload = skin; });

  /* état */
  const snap = () => JSON.stringify(G);
  function deal() {
    stopAnim(); closePanel(); rules = { draw: opts.draw, level: opts.level, scoring: opts.scoring }; syncMenu();
    const ids = [...Array(52).keys()];
    for (let i = 51; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
    G = { stock: [], waste: [], f: [[], [], [], []], t: [[], [], [], [], [], [], []], up: Array(52).fill(0), score: rules.scoring === "vegas" ? -52 : 0, recycles: 0 };
    if (rules.scoring === "vegas" && opts.keep) { vt += -52; LS.set(VKEY, String(vt)); }
    for (let c = 0; c < 7; c++) for (let k = 0; k <= c; k++) G.t[c].push(ids.pop());
    G.t.forEach(p => { G.up[p[p.length - 1]] = 1; });
    G.stock = ids; hist = []; secs = 0; started = false; won = false; clearInterval(timer); timer = null;
    C.forEach(c => { c.style.visibility = ""; });
    felt.classList.add("nofx"); layout(); requestAnimationFrame(() => felt.classList.remove("nofx"));
    status(`${L().name}: ` + (matchMedia("(pointer:coarse)").matches ? "tap a card to play it, or drag it" : "drag the cards, double-click to send them to the Aces"));
  }
  const find = id => {
    if (G.stock.includes(id)) return { p: "stock", a: G.stock };
    if (G.waste.includes(id)) return { p: "waste", a: G.waste };
    for (let i = 0; i < 4; i++) if (G.f[i].includes(id)) return { p: "f", i, a: G.f[i] };
    for (let i = 0; i < 7; i++) if (G.t[i].includes(id)) return { p: "t", i, a: G.t[i] };
  };
  const top = a => a[a.length - 1];
  const canF = (id, i) => { const p = G.f[i]; return p.length ? sOf(top(p)) === sOf(id) && rOf(id) === rOf(top(p)) + 1 : rOf(id) === 1; };
  const canT = (id, i) => { const p = G.t[i]; return p.length ? G.up[top(p)] && redOf(top(p)) !== redOf(id) && rOf(top(p)) === rOf(id) + 1 : rOf(id) === 13; };
  const add = n => {
    if (rules.scoring === "none") return;
    if (rules.scoring === "vegas") { G.score += n; if (opts.keep) { vt += n; LS.set(VKEY, String(vt)); } return; }
    G.score = Math.max(0, G.score + n);
  };
  const remember = () => { if (L().undo === 0) return; hist.push(snap()); while (hist.length > Math.min(L().undo, 300)) hist.shift(); };
  function startClock() {
    started = true; if (!opts.timed || timer || won) return;
    timer = setInterval(() => { if (won) return; secs++; if (rules.scoring === "standard" && secs % 10 === 0) add(-2); status(); }, 1000);
  }
  function scoreText() {
    if (rules.scoring === "none") return "";
    if (rules.scoring === "vegas") return "Score: " + money(opts.keep ? vt : G.score);
    return "Score: " + G.score;
  }
  function status(hint) { if (hint !== undefined) st1.textContent = hint; st2.textContent = [scoreText(), opts.timed ? "Time: " + secs : ""].filter(Boolean).join("  "); }

  function move(ids, from, toP, toI) {
    remember(); startClock();
    from.a.splice(from.a.length - ids.length, ids.length);
    (toP === "f" ? G.f[toI] : G.t[toI]).push(...ids);
    if (rules.scoring === "vegas") { if (toP === "f") add(5); else if (from.p === "f") add(-5); }
    else if (from.p === "waste") add(toP === "f" ? 10 : 5);
    else if (from.p === "t" && toP === "f") add(10);
    else if (from.p === "f" && toP === "t") add(-15);
    if (from.p === "t" && from.a.length && !G.up[top(from.a)]) { G.up[top(from.a)] = 1; if (rules.scoring === "standard") add(5); }
    layout(); status(); checkWin();
  }
  function stockClick() {
    if (G.stock.length) {
      remember(); startClock();
      for (let k = 0; k < rules.draw && G.stock.length; k++) { const id = G.stock.pop(); G.up[id] = 1; G.waste.push(id); }
    } else if (G.waste.length) {
      if (G.recycles >= maxRecycles()) { status("No more passes through the deck"); return; }
      remember(); startClock();
      while (G.waste.length) { const id = G.waste.pop(); G.up[id] = 0; G.stock.push(id); }
      G.recycles++; if (rules.scoring === "standard") add(rules.draw === 1 ? -100 : -20);
    } else return;
    layout(); status();
  }
  function undo() {
    if (won) return;
    if (L().undo === 0) { status("Undo is disabled in Hard"); return; }
    if (!hist.length) return;
    const prev = JSON.parse(hist.pop()), diff = prev.score - G.score; G = prev;
    if (rules.scoring === "vegas" && opts.keep && diff) { vt += diff; LS.set(VKEY, String(vt)); }
    layout(); status();
  }
  function toFound(id) {
    const from = find(id); if (!from || from.p === "stock" || from.p === "f" || top(from.a) !== id || !G.up[id]) return false;
    for (let i = 0; i < 4; i++) if (canF(id, i)) { move([id], from, "f", i); return true; }
    return false;
  }
  function autoAll() { let moved = true; while (moved && !won) { moved = false; const tops = [top(G.waste), ...G.t.map(top)].filter(x => x !== undefined); for (const id of tops) if (toFound(id)) { moved = true; break; } } }
  function smart(id) {
    const from = find(id); if (!from || !G.up[id]) return;
    if (top(from.a) === id && from.p !== "f" && toFound(id)) return;
    const ids = from.a.slice(from.a.indexOf(id));
    const order = [...Array(7).keys()].sort((a, b) => (G.t[b].length > 0) - (G.t[a].length > 0));
    for (const i of order) {
      if (from.p === "t" && from.i === i) continue;
      if (rOf(id) === 13 && from.p === "t" && from.a.indexOf(id) === 0 && !G.t[i].length) continue;
      if (canT(id, i)) return move(ids, from, "t", i);
    }
  }

  /* placement : cartes à leur taille d’origine (ou ×2) dès que la place le permet */
  function layout() {
    const W = felt.clientWidth, H = felt.clientHeight; if (!W || !H) return;
    const pad = Math.max(6, Math.round(W * .015));
    let w = Math.floor((W - 2 * pad) / (7 + 6 * .12)); w = Math.max(28, Math.min(w, Math.floor((H - 2 * pad) / 2.6 * 71 / 96)));
    const crisp = w >= 71; if (crisp) w = Math.min(142, 71 * Math.floor(w / 71));
    const h = Math.round(w * 96 / 71), gx = (W - 2 * pad - 7 * w) / 6, X = c => Math.round(pad + c * (w + gx));
    const y0 = pad, y1 = y0 + h + Math.max(pad, Math.round(h * .18));
    D = { w, h, X, y0, y1, pad, W, H, crisp };
    felt.style.setProperty("--w", w + "px"); felt.style.setProperty("--h", h + "px"); felt.classList.toggle("crisp", crisp);
    const place = (e, x, y) => { e.style.left = x + "px"; e.style.top = y + "px"; };
    place(slotStock, X(0), y0); slotF.forEach((e, i) => place(e, X(3 + i), y0)); slotT.forEach((e, i) => place(e, X(i), y1));
    slotStock.classList.toggle("x", !G.stock.length && (G.recycles >= maxRecycles() || !G.waste.length));
    let z = 1;
    const put = (id, x, y, up) => { const e = C[id]; e.style.transform = `translate(${x}px,${y}px)`; e.style.zIndex = z++; e.classList.toggle("back", !up); pos[id] = { x, y }; };
    G.stock.forEach((id, k) => put(id, X(0) + Math.floor(k / 8) * 2, y0 - Math.floor(k / 8) * 2, 0));
    const wl = G.waste.length, fan = rules.draw === 3 ? Math.min(3, wl) : 1;
    G.waste.forEach((id, k) => { const vis = k - (wl - fan); put(id, X(1) + (vis > 0 ? vis * Math.round(w * .2) : 0), y0, 1); });
    G.f.forEach((p, i) => p.forEach(id => put(id, X(3 + i), y0, 1)));
    G.t.forEach((p, c) => {
      const nd = p.filter(id => !G.up[id]).length, nu = p.length - nd;
      let dO = Math.max(3, Math.round(h * .09)), uO = Math.round(h * .26);
      const need = nd * dO + Math.max(0, nu - 1) * uO, avail = H - y1 - pad - h;
      if (need > avail && need > 0) { const k = Math.max(.25, avail / need); dO *= k; uO *= k; }
      let y = y1; p.forEach(id => { put(id, X(c), Math.round(y), G.up[id]); y += G.up[id] ? uO : dO; });
    });
  }

  /* souris et doigt */
  let drag = null;
  felt.addEventListener("contextmenu", e => { e.preventDefault(); if (!won && !anim) autoAll(); });
  felt.addEventListener("pointerdown", e => {
    if (anim) { finishAnim(); return; }
    if (won || e.button > 0 || el.querySelector(".solmsg")) return;
    const ce = e.target.closest(".pc"), slot = e.target.closest(".slot");
    if (!ce) { if (slot === slotStock) drag = { stock: true, sx: e.clientX, sy: e.clientY }; return; }
    const id = +ce.dataset.id, from = find(id);
    if (from.p === "stock") { drag = { stock: true, sx: e.clientX, sy: e.clientY }; return; }
    if (!G.up[id]) return;
    const idx = from.a.indexOf(id);
    if (from.p !== "t" && idx !== from.a.length - 1) return;
    drag = { id, from, ids: from.a.slice(idx), sx: e.clientX, sy: e.clientY, moved: false, type: e.pointerType, pid: e.pointerId };
  });
  felt.addEventListener("pointermove", e => {
    if (!drag || drag.stock) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 5) return;
    if (!drag.moved) {
      drag.moved = true; try { felt.setPointerCapture(drag.pid); } catch {}
      if (opts.outline) {   // option « Déplacement par contour » : seule une silhouette suit la souris, les cartes restent en place
        const a = pos[drag.ids[0]], z = pos[drag.ids[drag.ids.length - 1]], f = document.createElement("div");
        f.className = "dragframe thin"; f.style.width = D.w + "px"; f.style.height = (z.y - a.y + D.h) + "px"; f.style.transform = "translate(-9999px,-9999px)";
        document.body.appendChild(f); drag.frame = f; drag.fa = a;
      } else drag.ids.forEach((id, k) => { C[id].classList.add("drag"); C[id].style.zIndex = 900 + k; });
    }
    drag.dx = dx; drag.dy = dy;
    if (drag.raf) return;
    const d = drag;
    d.raf = requestAnimationFrame(() => {
      d.raf = 0;
      if (d.frame) { const r = felt.getBoundingClientRect(); d.frame.style.transform = `translate(${r.left + d.fa.x + d.dx}px,${r.top + d.fa.y + d.dy}px)`; return; }
      d.ids.forEach((id, k) => { C[id].style.transform = `translate(${pos[id].x + d.dx}px,${pos[id].y + d.dy}px)`; C[id].style.zIndex = 900 + k; });
    });
  });
  const endDrag = e => {
    const d = drag; drag = null; if (!d) return;
    if (d.raf) { cancelAnimationFrame(d.raf); d.raf = 0; }
    if (d.frame) d.frame.remove();
    if (d.stock) { if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 8) stockClick(); return; }
    d.ids.forEach(id => C[id].classList.remove("drag"));
    if (!d.moved) {
      if (d.type !== "mouse") { smart(d.id); return; }
      // double-clic détecté ici : fiable même quand la carte bouge entre les deux clics
      const now = Date.now();
      if (lastTap && lastTap.id === d.id && now - lastTap.t < 450) { lastTap = null; toFound(d.id); }
      else lastTap = { id: d.id, t: now };
      return;
    }
    const p0 = pos[d.id], Lx = p0.x + d.dx, T = p0.y + d.dy, R = Lx + D.w, B = T + D.h;
    const ov = (x1, y1, x2, y2) => Math.max(0, Math.min(R, x2) - Math.max(Lx, x1)) * Math.max(0, Math.min(B, y2) - Math.max(T, y1));
    let best = null, bestA = 0;
    if (d.ids.length === 1) for (let i = 0; i < 4; i++) { const a = ov(D.X(3 + i), D.y0, D.X(3 + i) + D.w, D.y0 + D.h); if (a > bestA && canF(d.id, i)) { best = ["f", i]; bestA = a; } }
    for (let i = 0; i < 7; i++) {
      if (d.from.p === "t" && d.from.i === i) continue;
      const tp = top(G.t[i]), yb = tp !== undefined ? pos[tp].y + D.h : D.y1 + D.h;
      const a = ov(D.X(i), D.y1 - D.h * .3, D.X(i) + D.w, yb + D.h * .3); if (a > bestA && canT(d.id, i)) { best = ["t", i]; bestA = a; }
    }
    if (best) move(d.ids, d.from, best[0], best[1]); else layout();
  };
  felt.addEventListener("pointerup", endDrag);
  felt.addEventListener("pointercancel", () => { if (drag && drag.frame) drag.frame.remove(); if (drag && !drag.stock) drag.ids.forEach(id => C[id].classList.remove("drag")); drag = null; layout(); });

  /* victoire : la célèbre cascade de cartes */
  function checkWin() {
    if (G.f.some(p => p.length < 13)) return;
    won = true; clearInterval(timer); timer = null; playSnd("tada");
    if (rules.scoring === "standard" && opts.timed && secs >= 30) G.score += Math.floor(700000 / secs);
    status("You won! Click to skip the animation"); cascade();
  }
  function cascade() {
    const cv = document.createElement("canvas"), r = devicePixelRatio || 1; cv.className = "solcv";
    cv.width = D.W * r; cv.height = D.H * r; felt.appendChild(cv);
    const g = cv.getContext("2d"); g.scale(r, r); g.imageSmoothingEnabled = !D.crisp;
    const queue = []; for (let rank = 13; rank >= 1; rank--) for (let i = 0; i < 4; i++) queue.push({ id: G.f[i][rank - 1], i });
    let cur = null; const s = D.w / 71;
    anim = { cv, raf: 0 };
    const next = () => {
      const q = queue.shift(); if (!q) return finishAnim();
      C[q.id].style.visibility = "hidden";
      cur = { id: q.id, x: D.X(3 + q.i), y: D.y0, vx: (Math.random() < .5 ? -1 : 1) * (2 + Math.random() * 5) * s, vy: -Math.random() * 7 * s };
    };
    next();
    const step = () => {
      if (!anim) return;
      for (let k = 0; k < 2 && cur; k++) {
        cur.vy += .45 * s; cur.x += cur.vx; cur.y += cur.vy;
        if (cur.y + D.h > D.H) { cur.y = D.H - D.h; cur.vy = -cur.vy * .78; }
        g.drawImage(SOL_IMG, (rOf(cur.id) - 1) * 71, sOf(cur.id) * 96, 71, 96, Math.round(cur.x), Math.round(cur.y), D.w, D.h);
        if (cur.x + D.w < 0 || cur.x > D.W) next();
      }
      if (anim) anim.raf = requestAnimationFrame(step);
    };
    anim.raf = requestAnimationFrame(step);
  }
  function stopAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim.cv.remove(); anim = null; } }
  function finishAnim() {
    stopAnim();
    G.f.flat().forEach(id => { C[id].style.visibility = "hidden"; });
    panel("Solitaire", `<p>Congratulations, you won (${L().name})!<br>${[scoreText(), opts.timed ? "Time: " + secs + " s" : ""].filter(Boolean).join(" · ")}</p><p>Deal again?</p>`,
      [["Yes", () => deal(), true], ["No", () => { G.f.flat().forEach(id => { C[id].style.visibility = ""; }); status("Game over"); }]]);
  }

  /* boîtes de dialogue dans la fenêtre */
  function closePanel() { el.querySelectorAll(".solmsg").forEach(m => m.remove()); }
  function panel(title, html, buttons, cls = "") {
    closePanel();
    const m = document.createElement("div"); m.className = "solmsg " + cls;
    m.innerHTML = `<h4>${title}<button class="tbtn x" type="button" aria-label="Close"><svg width="8" height="7" viewBox="0 0 8 7"><path d="M0 0h2l2 2 2-2h2L5 3.5 8 7H6L4 5 2 7H0l3-3.5z"/></svg></button></h4><div class="sb">${html}</div><div class="btns">${buttons.map((b, i) => `<button class="btn${b[2] ? " default" : ""}" type="button" data-b="${i}">${b[0]}</button>`).join("")}</div>`;
    felt.appendChild(m);
    m.querySelector(".tbtn").onclick = () => m.remove();
    m.querySelectorAll("[data-b]").forEach(b => { b.onclick = () => { const r = buttons[+b.dataset.b][1](m); if (r !== false) m.remove(); }; });
    return m;
  }
  function chooseBack() {
    let pick = back;
    const m = panel("Select Card Back", `<div class="backs">${SOL_BACKS.map((b, i) => `<button type="button" class="bk${i === back ? " on" : ""}" data-k="${i}" style="--bx:${b[0]};--by:${b[1]}" aria-label="Back ${i + 1}"></button>`).join("")}</div>`,
      [["OK", () => { back = pick; LS.set("h97-sol-back", String(back)); setBack(); }, true], ["Cancel", () => {}]], "wide");
    m.querySelector(".backs").addEventListener("click", e => { const b = e.target.closest(".bk"); if (!b) return; pick = +b.dataset.k; m.querySelectorAll(".bk").forEach(x => x.classList.toggle("on", x === b)); });
    m.querySelector(".backs").addEventListener("dblclick", e => { if (e.target.closest(".bk")) m.querySelector("[data-b='0']").click(); });
  }
  /* Fenêtre « Options » comme sous Windows 98 */
  function openOptions() {
    const radios = (name, items, cur) => items.map(([v, t]) => `<label><input type="radio" name="${name}" value="${v}"${String(cur) === String(v) ? " checked" : ""}>${t}</label>`).join("");
    const chk = (id, t, on) => `<label class="ck"><input type="checkbox" id="${id}"${on ? " checked" : ""}>${t}</label>`;
    const get = (mm, name) => mm.querySelector(`input[name=${name}]:checked`).value;
    const m = panel("Options", `
      <div class="og2">
        <fieldset><legend>Draw</legend>${radios("od", [[1, "Draw One"], [3, "Draw Three"]], opts.draw)}</fieldset>
        <fieldset><legend>Score</legend>${radios("os", [["standard", "Standard"], ["vegas", "Vegas"], ["none", "None"]], opts.scoring)}</fieldset>
      </div>
      <fieldset><legend>Difficulty</legend><div class="og3">${radios("ol", SOL_LEVELS.map((x, i) => [i, x.name]), opts.level)}</div><p class="oh"></p></fieldset>
      ${chk("oTimed", "Timed game", opts.timed)}${chk("oBar", "Status bar", opts.statusbar)}${chk("oOut", "Outline dragging", opts.outline)}${chk("oKeep", "Keep score", opts.keep)}`,
      [["OK", mm => {
        const n = { draw: +get(mm, "od") === 1 ? 1 : 3, scoring: get(mm, "os"), level: +get(mm, "ol"), timed: mm.querySelector("#oTimed").checked, statusbar: mm.querySelector("#oBar").checked, outline: mm.querySelector("#oOut").checked, keep: mm.querySelector("#oKeep").checked };
        if (n.keep && !opts.keep && rules.scoring === "vegas") { vt = (+LS.get(VKEY) || 0) + G.score; LS.set(VKEY, String(vt)); }
        const changed = n.draw !== rules.draw || n.level !== rules.level || n.scoring !== rules.scoring;
        Object.assign(opts, n); saveOpts(); applyDisplay();
        if (changed) { if (!started) deal(); else status("The new draw, scoring and difficulty settings will apply to the next game (F2)."); }
      }, true], ["Cancel", () => {}]], "opts");
    const sync = () => {
      const k = m.querySelector("#oKeep"), v = get(m, "os") === "vegas";
      k.disabled = !v; k.closest("label").classList.toggle("dis", !v);
      m.querySelector(".oh").textContent = SOL_LEVELS[+get(m, "ol")].txt;
    };
    m.addEventListener("change", sync); sync();
  }
  /* options d'affichage et de chrono, appliquées tout de suite */
  const bar = el.querySelector(".solstat");
  function applyDisplay() {
    bar.style.display = opts.statusbar ? "" : "none";
    if (!opts.timed) { clearInterval(timer); timer = null; } else if (started && !won) startClock();
    status();
  }
  function help() {

      <p><b>Deck:</b> click it to turn over cards. When it’s empty, a green circle lets you turn it over again; a red cross means it can’t be turned over any more.</p>
      <p><b>Controls:</b> drag cards with the mouse or your finger. Double-click a card to send it to the Aces. Right-click: everything that can go to the Aces goes there. On a phone, tapping a card plays it to the best spot. F2: new game. Ctrl+Z: undo.</p>

  el._keys = e => {

  syncMenu(); deal(); applyDisplay();
  el._sol = { state: () => G, set: g => { G = g; layout(); }, checkWin };
}

function selectSettingsTab(el, tab, opts = {}) {

  q("#sUrl").value = LS.get("mv-sb-url"); q("#sKey").value = LS.get("mv-sb-key"); q("#tKey").value = LS.get("videotheque.tmdbkey");
  const say = (id, msg, kind = "") => { const s = q(id); s.textContent = msg; s.className = "status " + kind; };

    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url) && !/^https:\/\/\S+$/.test(url)) return say("#sStatus", "The project URL must start with https:// (for example https://abcd1234.supabase.co).", "err");
    if (key.length < 20) return say("#sStatus", "Paste the project’s full public key.", "err");
    if (/^sb_secret_/.test(key) || /service_role/.test(key)) return say("#sStatus", "That’s the secret key: paste the “anon” or “publishable” key instead.", "err");
    LS.set("mv-sb-url", url); LS.set("mv-sb-key", key); sbClient = null;
    say("#sStatus", "Settings saved. Checking…");
    await connect(); renderAcct(el); reloadApp("vinyls");
    say("#sStatus", sbClient ? "Server found." : "Supabase isn’t responding: check the URL and your connection.", sbClient ? "ok" : "err");
  });

  initAccountTabs(el);

  q("#sCfg").addEventListener("click", () => {
    const url = LS.get("mv-sb-url"), key = LS.get("mv-sb-key");
    if (!url || !key) return say("#sStatus", "Save the server URL and key first.", "err");
    const txt = `/* Hobbys97: settings shared by all your devices (Supabase URL and public key, safe to publish) */\nwindow.H97_CONFIG = ${JSON.stringify({ sbUrl: url, sbKey: key }, null, 2)};\n`;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" })); a.download = "config.js";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    say("#sStatus", "config.js downloaded: upload it to GitHub next to index.html.", "ok");
  });

  q("#tSave").addEventListener("click", async () => {
    const k = q("#tKey").value.trim(); LS.set("videotheque.tmdbkey", k); reloadApp("films"); syncKeys();
    if (!k) return say("#tStatus", "Key removed.");
    say("#tStatus", "Checking…");
    try {
      const u = new URL("https://api.themoviedb.org/3/configuration"), h = { accept: "application/json" };
      if (k.length > 40) h.Authorization = "Bearer " + k; else u.searchParams.set("api_key", k);
      const r = await fetch(u, { headers: h });
      say("#tStatus", r.ok ? "Key saved and valid." : "Key saved, but TMDB rejects it. Please check it.", r.ok ? "ok" : "err");
    } catch { say("#tStatus", "Key saved. TMDB didn’t respond to verify it.", ""); }
  });

  q("#acct").addEventListener("click", async e => {
    const b = e.target.closest("[data-acct]"); if (!b) return;
    if (b.dataset.acct === "out") {
      try { await sbClient.auth.signOut(); } catch {}
      sbUser = null; renderAcct(el); reloadApp("vinyls"); setNet(); return say("#sStatus", "Signed out.");
    }
    const email = q("#aMail").value.trim(), password = q("#aPass").value;
    if (!email || !password) return say("#sStatus", "Enter your e-mail address and password.", "err");
    if (!sbClient) await connect();
    if (!sbClient) return say("#sStatus", "Save the server URL and key first.", "err");
    say("#sStatus", "Signing in…");
    let res;
    try { res = await sbClient.auth.signInWithPassword({ email, password }); } catch (err) { res = { error: err }; }
    const error = res.error;
    if (error) {
      const m = String(error.message || error);
      return say("#sStatus", /invalid login/i.test(m) ? "Incorrect e-mail or password."
        : /failed to fetch|network|load failed/i.test(m) ? "Can’t reach the Supabase server: check the project URL, that the project isn’t paused, and that no extension is blocking supabase.co."
        : /email not confirmed/i.test(m) ? "Your address isn’t confirmed yet: click the link you received by e-mail." : m, "err");
    }
    sbUser = res.data.user; renderAcct(el); reloadApp("vinyls"); setNet();
    if (await syncKeys()) { q("#tKey").value = LS.get("videotheque.tmdbkey"); say("#tStatus", "TMDB key restored from your account.", "ok"); }
    say("#sStatus", "Signed in: your vinyl collection will now sync.", "ok");
  });

  renderAcct(el);
  connect().then(() => renderAcct(el));
}

        const r = await fetch(MCAPI + "/oauth/token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ grant_type: "password", client_id: MCID, client_secret: MCSEC, username: m, password: p }) });
        if (!r.ok) return sayM("Incorrect Mangacollec e-mail or password.", "err");
        sessionStorage.setItem("h97-mc-token", (await r.json()).access_token); q("#mPass").value = "";
      } else if (u) {
        let d = {}; try { d = JSON.parse(localStorage.getItem("h97-manga-v1")) || { v: 1, series: {} }; } catch { d = { v: 1, series: {} }; }
        d.mcUser = u; localStorage.setItem("h97-manga-v1", JSON.stringify(d));
      } else return sayM("Enter your username, or your e-mail and password.", "err");
      sayM("Import started in the Mangas window.", "ok"); openMangaImport();
    } catch { sayM("Mangacollec isn’t responding right now.", "err"); }
  });
  q("#mGoogle").addEventListener("click", async () => {
    try {
      const a = await fbAuth(); const pr = new firebase.auth.GoogleAuthProvider(); pr.addScope("email"); pr.addScope("profile");
      sayM("Signing in with Google…");
      const res = await a.signInWithPopup(pr), g = res.credential && res.credential.accessToken;
      const r = await fetch(MCAPI + "/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider: "google", assertion: g, client: "web" }) });
      const j = r.ok ? await r.json() : null;
      if (!j || !j.access_token) return sayM("Mangacollec refused the Google sign-in from this site: use your username (public profile), or create a password on Mangacollec.", "err");
      sessionStorage.setItem("h97-mc-token", j.access_token); sayM("Import started in the Mangas window.", "ok"); openMangaImport(); ["cards", "films"].forEach(reloadApp);
    } catch (err) { if (err && err.code !== "auth/popup-closed-by-user") sayM(fbErrMsg(err), "err"); }
  });
}

function renderAcct(el) {
  const box = el && el.querySelector("#acct"); if (!box) return;
  if (!LS.get("mv-sb-url") || !LS.get("mv-sb-key")) { box.innerHTML = `<p class="hint">Save the server URL and key first.</p>`; return; }
  if (sbUser) {
    box.innerHTML = `<div class="who"><img data-icon="vinyl" alt=""><span>Signed in as<br><b>${esc(sbUser.email || "")}</b></span></div>
      <div class="btns"><button class="btn" type="button" data-acct="out">Sign out</button></div>`;
    fillIcons(box);
  } else {
    box.innerHTML = `<div class="row"><label for="aMail">E-mail</label><input type="email" id="aMail" autocomplete="username"></div>
      <div class="row"><label for="aPass">Mot de passe</label><input type="password" id="aPass" autocomplete="current-password"></div>
      <div class="btns"><button class="btn default" type="button" data-acct="in">Se connecter</button></div>`;
    box.querySelector("#aPass").addEventListener("keydown", e => { if (e.key === "Enter") box.querySelector("[data-acct='in']").click(); });
  }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function loadSupabase() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function connect() {
  const url = LS.get("mv-sb-url"), key = LS.get("mv-sb-key");
  if (!url || !key) { sbClient = null; sbUser = null; setNet(); return; }
  try {
    await loadSupabase();
    if (!sbClient) sbClient = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "mv-sb-auth" } });
    const { data } = await sbClient.auth.getSession();
    sbUser = data && data.session ? data.session.user : null;
  } catch { sbClient = null; sbUser = null; }
  setNet();
  if (sbUser) syncKeys();
}
/* La clé TMDB voyage avec ton compte (données privées du compte Supabase) : saisie une fois, retrouvée partout. */
async function syncKeys() {
  if (!sbClient || !sbUser) return false;
  try {
    const { data } = await sbClient.auth.getUser(); if (!data || !data.user) return false;
    sbUser = data.user;
    const meta = (sbUser.user_metadata && sbUser.user_metadata.h97) || {}, local = LS.get("videotheque.tmdbkey");
    if (meta.tmdb && !local) { LS.set("videotheque.tmdbkey", meta.tmdb); reloadApp("films"); return true; }
    if (local && local !== meta.tmdb) await sbClient.auth.updateUser({ data: { h97: { ...meta, tmdb: local } } });
  } catch {}
  return false;
}
let netBusy = 0, netTimer = null, netFrame = 0;
function setNet() {
  const i = $("#netIcon");
  if (netBusy) return;
  i.src = netIcon(!!sbUser);
  i.title = sbUser ? `Connected (${sbUser.email || ""})` : "Offline";
}
/* pendant un chargement : les deux écrans clignotent, comme la connexion d’époque */
function netActivity(on) {
  const i = $("#netIcon");
  netBusy = Math.max(0, netBusy + (on ? 1 : -1));
  document.documentElement.classList.toggle("busy", netBusy > 0);
  if (netBusy && !netTimer) {
    i.title = "Connecting…";
    netTimer = setInterval(() => { netFrame ^= 1; i.src = ICON[netFrame ? "net1" : "net2"]; }, 320);
  } else if (!netBusy && netTimer) { clearInterval(netTimer); netTimer = null; setNet(); }
}
function reloadApp(id) { const w = wins[id]; if (w) { const f = w.el.querySelector("iframe"); f.src = f.src; } }

/* Le site de vinyles peut aussi se connecter de lui-même : on suit la session partagée. */
addEventListener("storage", e => { if (e.key === "videotheque.tmdbkey") syncKeys(); });
addEventListener("storage", e => { if (e.key === "mv-sb-auth" || e.key === "mv-sb-url" || e.key === "mv-sb-key") { sbClient = null; connect().then(() => wins.settings && renderAcct(wins.settings.el)); } });
if (LS.get("mv-sb-url")) connect();
loadDocs().then(() => paint($("#desktop"), wallpaper));
loadSongs().then(() => { if (wins.docs) renderDocs(wins.docs.el); if (wins.cd) wins.cd.el._cd.refresh(); });
})();
</script>
<script>
/* Pas de zoom au double toucher dans les jeux (Solitaire, Démineur) : le 2e toucher rapproché est neutralisé.
   Le pincement à deux doigts n'est pas touché. */
(() => {
  let last = 0;
  document.addEventListener("touchend", e => {
    if (!e.target.closest) return;
    if (!e.target.closest(".felt,.ms") || e.target.closest(".solmsg,.drop,.menubar,.mspanel,.tbar")) return;
    const now = Date.now(); if (now - last < 400) e.preventDefault(); last = now;
  }, { passive: false });
  document.addEventListener("dblclick", e => { if (e.target.closest && e.target.closest(".felt,.ms")) e.preventDefault(); });
  document.addEventListener("gesturestart", e => { if (e.target.closest && e.target.closest(".felt,.ms")) e.preventDefault(); });
})();
</script>
