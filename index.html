<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>Hobbys97</title>
<link rel="icon" id="favicon">
<style>
:root{
  --teal:#008080;--face:#c0c0c0;--light:#dfdfdf;--white:#fff;--shadow:#808080;--dark:#0a0a0a;
  --navy:#000080;--blue:#1084d0;--text:#000;
  --raised:inset -1px -1px var(--dark),inset 1px 1px var(--white),inset -2px -2px var(--shadow),inset 2px 2px var(--light);
  --sunken:inset -1px -1px var(--white),inset 1px 1px var(--shadow),inset -2px -2px var(--light),inset 2px 2px var(--dark);
  --pressed:inset -1px -1px var(--white),inset 1px 1px var(--dark),inset -2px -2px var(--light),inset 2px 2px var(--shadow);
  --tb:30px;
  font-family:Tahoma,"MS Sans Serif","Microsoft Sans Serif",Geneva,Arial,sans-serif;font-size:11px;
  -webkit-font-smoothing:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--teal);color:var(--text);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
img,canvas{image-rendering:pixelated}
img{-webkit-user-drag:none}
button{font:inherit;color:inherit}
:focus-visible{outline:1px dotted #000;outline-offset:-4px}

/* ---------- Bureau ---------- */
#desktop{position:fixed;inset:0 0 calc(var(--tb) + env(safe-area-inset-bottom,0px)) 0;padding:calc(6px + env(safe-area-inset-top,0px)) 4px 4px calc(4px + env(safe-area-inset-left,0px))}
.icons{display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,76px);grid-auto-columns:78px;height:100%;gap:0}
.dicon{display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;padding:2px 0;border:0;background:none;cursor:var(--cur)}
.dicon img{width:32px;height:32px}
.dicon span{color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.75);padding:1px 2px;line-height:1.25;text-align:center;border:1px dotted transparent}
.dicon.sel img{filter:brightness(.55) sepia(1) hue-rotate(190deg) saturate(6)}
.dicon.sel span{text-shadow:none;background:var(--navy);border-color:#ff0}
.dicon:focus-visible{outline:none}
.dicon:focus-visible span{border-color:#fff}

/* ---------- Fenêtres ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:var(--face);box-shadow:var(--raised);padding:3px;min-width:240px;min-height:160px}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important}
.win[hidden]{display:none}
.tbar{display:flex;align-items:center;gap:4px;height:20px;padding:0 2px 0 3px;background:linear-gradient(90deg,var(--shadow),#b5b5b5);color:var(--light);font-weight:bold;cursor:var(--cur);touch-action:none;flex:none}
.win.active .tbar{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff}
.tbar img{width:16px;height:16px}
.tbar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:18px;height:16px;padding:0;border:0;background:var(--face);box-shadow:var(--raised);display:grid;place-items:center;flex:none}
.tbtn:active{box-shadow:var(--pressed)}
.tbtn svg{display:block}
.tbtn.x{margin-left:2px}
.menubar{display:flex;gap:0;padding:2px 0;flex:none}
.menubar span{padding:1px 6px}
.menubar u{text-decoration:underline}
.wbody{position:relative;flex:1;box-shadow:var(--sunken);padding:2px;background:#fff;min-height:0}
.wbody iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.wbody .loading{position:absolute;inset:2px;display:grid;place-items:center;color:var(--shadow);pointer-events:none}
.grip{position:absolute;right:2px;bottom:2px;width:14px;height:14px;touch-action:none;
  background:linear-gradient(135deg,transparent 0 45%,var(--white) 45% 52%,var(--shadow) 52% 60%,transparent 60% 66%,var(--white) 66% 73%,var(--shadow) 73% 81%,transparent 81%)}
.win.max .grip{display:none}
.shield{position:absolute;inset:0;display:none}
body.dragging .shield{display:block}
body.dragging{cursor:var(--cur)}

/* ---------- Barre des tâches ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tb) + env(safe-area-inset-bottom,0px));padding:4px 2px env(safe-area-inset-bottom,0px) calc(2px + env(safe-area-inset-left,0px));display:flex;align-items:flex-start;gap:4px;background:var(--face);box-shadow:inset 0 1px var(--light),inset 0 2px var(--white);z-index:9000}
#taskbar>*{height:22px}
.start{display:flex;align-items:center;gap:3px;padding:0 5px 0 3px;border:0;background:var(--face);box-shadow:var(--raised);font-weight:bold;flex:none}
.start img{height:14px;width:auto;image-rendering:auto}
.start[aria-expanded="true"]{box-shadow:var(--pressed);padding:1px 4px 0 4px}
.sep{width:2px;flex:none;box-shadow:inset 1px 0 var(--shadow),inset -1px 0 var(--white);margin:0 1px}
.tasks{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
.task{display:flex;align-items:center;gap:4px;min-width:0;max-width:160px;flex:1 1 160px;padding:0 6px 0 4px;border:0;background:var(--face);box-shadow:var(--raised);text-align:left}
.task img{width:16px;height:16px;flex:none}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{box-shadow:var(--pressed);font-weight:bold;background:repeating-conic-gradient(var(--white) 0 25%,var(--face) 0 50%) 0 0/2px 2px}
.tray{display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;box-shadow:inset -1px -1px var(--white),inset 1px 1px var(--shadow);flex:none;margin-right:calc(env(safe-area-inset-right,0px))}
.tray img{width:16px;height:16px}

/* ---------- Menu Démarrer ---------- */
#startmenu{position:fixed;left:calc(2px + env(safe-area-inset-left,0px));bottom:calc(var(--tb) - 2px + env(safe-area-inset-bottom,0px));display:flex;background:var(--face);box-shadow:var(--raised);padding:3px;z-index:9100}
#startmenu[hidden]{display:none}
.band{width:24px;background:linear-gradient(0deg,var(--navy),var(--blue));display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.band span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-size:18px;font-family:"Arial Black",Arial,sans-serif;letter-spacing:.5px;white-space:nowrap}
.band span b{font-weight:900}
.band span i{font-style:normal;font-weight:400;color:#dfe8ff}
.items{display:flex;flex-direction:column;min-width:178px}
.mi{display:flex;align-items:center;gap:10px;height:38px;padding:0 20px 0 6px;border:0;background:none;text-align:left;font-size:12px}
.mi img{width:32px;height:32px}
.mi u{text-decoration:underline}
.mi:hover,.mi:focus-visible{background:var(--navy);color:#fff;outline:none}
.mdiv{height:2px;margin:3px 2px;box-shadow:inset 0 1px var(--shadow),inset 0 -1px var(--white)}

/* ---------- Boîte de dialogue Réglages ---------- */
.dlg .wbody{background:var(--face);box-shadow:none;padding:6px 8px 8px;overflow:auto}
.tabs{display:flex;gap:0;padding-left:2px;position:relative;z-index:1}
.tab{border:0;background:var(--face);padding:3px 10px 2px;margin-right:-1px;box-shadow:inset 1px 1px var(--white),inset -1px 0 var(--dark),inset -2px 0 var(--shadow);border-radius:3px 3px 0 0;position:relative;top:2px}
.tab[aria-selected="true"]{top:0;padding:4px 12px 4px;z-index:2;background:var(--face)}
.tabpane{box-shadow:var(--raised);padding:12px 10px 10px;margin-top:-1px}
.tabpane[hidden]{display:none}
fieldset{border:0;box-shadow:inset -1px -1px var(--white),inset 1px 1px var(--shadow),inset -2px -2px var(--shadow),inset 2px 2px var(--white);padding:10px 10px 10px;margin:0 0 10px}
legend{padding:0 3px}
.row{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.row label{white-space:nowrap}
input[type=text],input[type=email],input[type=password],input[type=url]{font:inherit;width:100%;height:21px;padding:2px 3px;border:0;background:#fff;box-shadow:var(--sunken);user-select:text;-webkit-user-select:text;border-radius:0}
.btns{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.btn{min-width:75px;height:23px;padding:0 10px;border:0;background:var(--face);box-shadow:var(--raised)}
.btn:active{box-shadow:var(--pressed)}
.btn[disabled]{color:var(--shadow);text-shadow:1px 1px var(--white)}
.btn.default{box-shadow:inset 0 0 0 1px var(--dark),inset -2px -2px var(--dark),inset 2px 2px var(--white),inset -3px -3px var(--shadow),inset 3px 3px var(--light)}
.status{min-height:14px;margin:8px 0 0;line-height:1.4}
.status.err{color:#a00000}
.status.ok{color:#006000}
.hint{color:#404040;line-height:1.45;margin:0 0 8px;max-width:58ch}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;line-height:1.4}
.who img{width:32px;height:32px}
.dlgfoot{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}

/* ---------- Icône décorative ---------- */
.dicon{touch-action:none}
.dicon.moving{opacity:.35}
.dicon.ghost{position:fixed;z-index:9500;pointer-events:none;opacity:.8}
.dicon.ghost span{background:var(--navy);border-color:#ff0;text-shadow:none}

/* ---------- Explorateur (My Documents) ---------- */
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:3px 2px 4px;flex:none;align-items:center}
.toolbar .btn{min-width:0}
.addr{display:flex;align-items:center;gap:6px;padding:0 2px 4px;flex:none}
.addr span{flex:none}
.addr div{flex:1;height:21px;padding:3px 4px;background:#fff;box-shadow:var(--sunken);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:text}
.page .wbody{overflow:auto}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px 4px;padding:8px;align-content:start}
.file{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px;border:0;background:none;cursor:var(--cur)}
.file .th{width:64px;height:48px;display:grid;place-items:center;background:#fff;border:1px solid var(--shadow);overflow:hidden}
.file .th img{max-width:100%;max-height:100%;image-rendering:auto}
.file span{max-width:88px;padding:1px 2px;line-height:1.25;text-align:center;overflow-wrap:anywhere;border:1px dotted transparent}
.file.sel .th{outline:2px solid var(--navy)}
.file.sel span{background:var(--navy);color:#fff;border-color:#ff0}
.empty{padding:16px;color:var(--shadow)}
.statusbar{display:flex;gap:2px;margin-top:2px;flex:none}
.statusbar span{flex:1;height:18px;padding:2px 4px;box-shadow:inset -1px -1px var(--white),inset 1px 1px var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar span:last-child{flex:0 0 120px}

/* ---------- Navigateur ---------- */
.ie .wbody{overflow:auto;background:#fff}
.web{max-width:640px;margin:0 auto;padding:18px 16px 28px;font-family:"Times New Roman",Times,serif;font-size:16px;color:#000;user-select:text}
.web h1{font-size:28px;margin:0 0 4px;color:#000080}
.web p{margin:0 0 14px;line-height:1.4}
.web hr{border:0;border-top:2px groove #c0c0c0;margin:14px 0}
.web .lnk{display:flex;gap:12px;align-items:center;padding:10px;margin:0 0 10px;border:2px outset #e0e0e0;background:#f4f4f4;text-decoration:none;color:inherit}
.web .lnk:active{border-style:inset}
.web .lnk img{width:32px;height:32px;flex:none}
.web .lnk b{display:block;color:#0000ee;text-decoration:underline;font-size:18px}
.web .lnk small{font-size:14px;color:#333}
.web .foot{font-size:12px;color:#555;text-align:center}
.iebtn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;padding:2px 4px;border:0;background:none;font-size:11px}
.iebtn svg{width:20px;height:20px}
.iebtn[disabled]{color:var(--shadow)}

/* ---------- Propriétés d’affichage ---------- */
.monitor{width:182px;margin:0 auto 22px;padding:10px 10px 14px;background:var(--face);box-shadow:var(--raised);border-radius:4px 4px 2px 2px;position:relative}
.monitor::after{content:"";position:absolute;left:50%;bottom:-14px;width:70px;height:12px;margin-left:-35px;background:var(--face);box-shadow:var(--raised)}
.screen{height:118px;box-shadow:var(--sunken);background-color:var(--teal);background-position:center;background-repeat:no-repeat;image-rendering:auto}
.listbox{height:118px;overflow:auto;background:#fff;box-shadow:var(--sunken);padding:2px}
.listbox button{display:flex;align-items:center;gap:6px;width:100%;padding:1px 3px;border:0;background:none;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listbox button img{width:16px;height:16px;flex:none}
.listbox button[aria-selected="true"]{background:var(--navy);color:#fff}
.wprow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;margin-top:4px}
.wprow .side{display:flex;flex-direction:column;gap:6px}
select{font:inherit;height:21px;border:0;background:#fff;box-shadow:var(--sunken);padding:0 2px;border-radius:0}

/* ---------- Curseurs ---------- */
:root{--cur:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAVCAYAAAByrA+0AAAAcElEQVR4nJXRUQ6AMAgD0EK8/5Xxw2kQGHQki870rRoBwHAwuq40UgAwMxq9DTRSv2GQxgcTSmBCJejQFuxQCyo0goiuLigiyaaGIiR+6RBO84EVludW0rv/gAvTDTG8bVH25NhQTdlC/bjTMbhvuAGO+TUX0swgRAAAAABJRU5ErkJggg==") 0 0,default;--hand:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABEAAAAWCAYAAAAmaHdCAAAAh0lEQVR4nNWTSw7AIAhEZ0jvf2W6qDZoUVHbRScxcUEeww/wpemFJB5AVaGqGbYEmda/IMMmH0PC1WCQtCDOOimAZmo3dLkndgXEUMPLVYPEsVkHPf61inJ6gb04AUCSfnRQ2ckW6DGdaEktyLKbrdtJSVlDltx8dsUhN7mU15y0UkbnTAA4AXTSOhOPnY1KAAAAAElFTkSuQmCC") 5 0,pointer}
html{cursor:var(--cur)}
*{cursor:inherit}
button:not([disabled]),a[href],[role="tab"],select,label[for],.dicon:not(.deco),.file,.listbox button,.lnk{cursor:var(--hand)}
.grip{cursor:nwse-resize}
.dicon.deco{cursor:var(--cur)}
input[type=text],input[type=email],input[type=password],input[type=url]{cursor:text}

/* ---------- Démineur ---------- */
.win.mines{min-width:0;min-height:0;max-width:calc(100vw - 4px)}
.win.mines .menubar{position:relative}
.mbtn{border:0;background:none;padding:1px 6px;font:inherit}
.mbtn[aria-expanded="true"]{background:var(--navy);color:#fff}
.mbtn u{text-decoration:underline}
.drop{position:absolute;left:0;top:100%;z-index:5;min-width:190px;background:var(--face);box-shadow:var(--raised);padding:3px}
.drop[hidden]{display:none}
.drop button{display:grid;grid-template-columns:16px 1fr auto;gap:4px;align-items:center;width:100%;padding:3px 10px 3px 4px;border:0;background:none;text-align:left;font:inherit}
.drop button:hover,.drop button:focus-visible{background:var(--navy);color:#fff;outline:none}
.drop kbd{font:inherit}
.drop hr{border:0;height:2px;margin:3px 1px;box-shadow:inset 0 1px var(--shadow),inset 0 -1px var(--white)}
.ms{--c:16px;background:var(--face);padding:6px;box-shadow:inset 1px 1px var(--white),inset -1px -1px var(--shadow);border-left:2px solid var(--white);border-top:2px solid var(--white)}
@media (pointer:coarse){.ms.l0,.ms.l1{--c:24px}.ms.l2{--c:22px}}
.ms-top{display:flex;align-items:center;justify-content:space-between;padding:4px 5px;margin-bottom:6px;box-shadow:inset 2px 2px var(--shadow),inset -2px -2px var(--white)}
.led{display:flex;padding:1px;background:#000;box-shadow:1px 1px var(--white),-1px -1px var(--shadow)}
.led svg{display:block;width:13px;height:23px}
.face{width:26px;height:26px;padding:0;border:1px solid var(--shadow);background:var(--face);box-shadow:var(--raised);display:grid;place-items:center}
.face:active{box-shadow:inset 1px 1px var(--shadow)}
.face svg{width:17px;height:17px;display:block}
.ms-wrap{overflow:auto;max-width:calc(100vw - 30px);box-shadow:inset 3px 3px var(--shadow),inset -3px -3px var(--white);padding:3px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--c));touch-action:manipulation;-webkit-touch-callout:none}
.cell{width:var(--c);height:var(--c);background:var(--face);box-shadow:inset -2px -2px var(--shadow),inset 2px 2px var(--white);display:grid;place-items:center;font:900 calc(var(--c) * .78)/1 "Arial Black",Tahoma,Arial,sans-serif;background-repeat:no-repeat;background-position:center;background-size:calc(var(--c) - 3px)}
.cell.down,.cell.open{box-shadow:inset 1px 1px var(--shadow)}
.cell.flag{background-image:var(--flag)}
.cell.boom{background-color:#ff0000}
.cell.mine{background-image:var(--mine)}
.cell.wrong{background-image:var(--mine);position:relative}
.cell.wrong::after{content:"";position:absolute;inset:2px;background:linear-gradient(45deg,transparent 44%,#e00 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#e00 44% 56%,transparent 56%)}
.n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}.n5{color:#800000}.n6{color:#008080}.n7{color:#000}.n8{color:#808080}
.mspanel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(192,192,192,.6);z-index:6}
.mspanel[hidden]{display:none}
.mspanel>div{background:var(--face);box-shadow:var(--raised);padding:10px 12px;min-width:200px;max-width:90%}
.mspanel h4{margin:0 0 8px;font-size:11px}
.mspanel table{border-collapse:collapse;margin-bottom:10px;width:100%}
.mspanel td{padding:2px 4px}
.mspanel td:last-child{text-align:right}
.mspanel .btns{justify-content:center}
.mspanel input{width:100%;margin-bottom:8px}

.colrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:0 0 10px}
.sws{display:flex;flex-wrap:wrap;gap:3px}
.sw{width:18px;height:18px;padding:0;border:0;box-shadow:var(--sunken)}
.sw[aria-pressed="true"]{outline:2px solid #000;outline-offset:1px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

@media (max-width:640px){
  .tasks .task span{display:none}
  .task{flex:0 0 auto;max-width:none;padding:0 5px}
  .row{grid-template-columns:1fr}
  .wprow{grid-template-columns:1fr}
  .colrow{grid-template-columns:1fr auto}
  .colrow>span{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){
  #startmenu:not([hidden]){animation:slide .12s steps(4) both}
  @keyframes slide{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
}
</style>
</head>
<body>

<main id="desktop" aria-label="Bureau">
  <div class="icons" id="icons"></div>
</main>

<div id="windows"></div>

<nav id="startmenu" hidden aria-label="Menu Démarrer">
  <div class="band" aria-hidden="true"><span><b>Hobbys</b><i>97</i></span></div>
  <div class="items" role="menu">
    <button class="mi" role="menuitem" data-open="vinyls"><img data-icon="vinyl" alt=""><span><u>V</u>inyls</span></button>
    <button class="mi" role="menuitem" data-open="films"><img data-icon="dvd" alt=""><span><u>F</u>ilms</span></button>
    <button class="mi" role="menuitem" data-open="cards"><img data-icon="card" alt=""><span><u>C</u>ards</span></button>
    <div class="mdiv" role="separator"></div>
    <button class="mi" role="menuitem" data-open="docs"><img data-icon="docs" alt=""><span>My <u>D</u>ocuments</span></button>
    <button class="mi" role="menuitem" data-open="ie"><img data-icon="ie" alt=""><span><u>I</u>nternet Explorer</span></button>
    <button class="mi" role="menuitem" data-open="mines"><img data-icon="mines" alt=""><span><u>M</u>inesweeper</span></button>
    <div class="mdiv" role="separator"></div>
    <button class="mi" role="menuitem" data-open="settings"><img data-icon="settings" alt=""><span><u>S</u>ettings</span></button>
  </div>
</nav>

<footer id="taskbar">
  <button class="start" id="startBtn" type="button" aria-haspopup="menu" aria-expanded="false"><img data-icon="logo" alt="">Start</button>
  <div class="sep" aria-hidden="true"></div>
  <div class="tasks" id="tasks"></div>
  <div class="tray"><img data-icon="net" alt="" id="netIcon" title="Vinyls : non connecté"><time id="clock"></time></div>
</footer>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);

/* ================= Icônes en pixel art (dessinées pixel par pixel) ================= */
const ICON = {};
function px(size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"); const p = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  draw(p, g); return c.toDataURL();
}
const dist = (x, y, c) => Math.hypot(x + .5 - c, y + .5 - c);

ICON.vinyl = px(32, p => {
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    const d = dist(x, y, 16); if (d > 15.2) continue;
    let col = "#161616";
    if (d > 14.3) col = "#000";
    else if (Math.abs(d - 12) < .5 || Math.abs(d - 9.5) < .5 || Math.abs(d - 7.4) < .45) col = "#2e2e2e";
    if (d < 6.2) col = "#c8261e";
    if (d < 6.2 && d > 5.4) col = "#8a140f";
    if (d < 6.2 && (x + y) % 7 === 0 && y < 15) col = "#e8534a";
    if (d < 1.4) col = "#000";
    const a = Math.atan2(y + .5 - 16, x + .5 - 16);
    if (d > 7 && d < 14 && a > -2.5 && a < -1.9 && (Math.round(d) % 2)) col = "#8c8c8c";
    if (d > 7 && d < 14 && a > .6 && a < 1.1 && (Math.round(d) % 2)) col = "#5a5a5a";
    p(x, y, col);
  }
});

const APPS = {
  vinyls:   { title: "My Discollection", label: "Vinyls", icon: "vinyl", src: "vinyls.html" },

/* Raccourcis du bureau */
const icons = $("#icons");
const DECO = { computer: "My Computer", bin: "Recycle Bin" };
const ICON_IDS = ["computer", "vinyls", "films", "cards", "docs", "ie", "mines", "bin"];
const iconOrder = (() => { let o = []; try { o = JSON.parse(localStorage.getItem("h97-icons")) || []; } catch {} o = o.filter(x => ICON_IDS.includes(x)); return [...o, ...ICON_IDS.filter(x => !o.includes(x))]; })();
iconOrder.forEach(id => {
  const b = document.createElement(DECO[id] ? "div" : "button");
  if (DECO[id]) { b.className = "dicon deco"; b.setAttribute("aria-hidden", "true"); b.innerHTML = `<img data-icon="${id}" alt=""><span>${DECO[id]}</span>`; }
  else { const a = APPS[id]; b.className = "dicon"; b.type = "button"; b.dataset.app = id; b.innerHTML = `<img data-icon="${a.icon}" alt=""><span>${a.label}</span>`; }
  b.dataset.id = id; icons.appendChild(b);
});
fillIcons(icons);
let lastPointer = "mouse";
icons.addEventListener("pointerdown", e => { lastPointer = e.pointerType; });

/* Glisser-déposer pour changer l’ordre des icônes (souris et doigt) */
let drag = null, swallowClick = false;
icons.addEventListener("pointerdown", e => {
  const it = e.target.closest(".dicon"); if (!it || e.button > 0) return;
  drag = { it, x: e.clientX, y: e.clientY, pid: e.pointerId, on: false };
});
addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;

  });

  files.addEventListener("dblclick", e => { const f = e.target.closest(".file"); if (f) openApp("settings", { tab: "bg", select: f.dataset.id }); });

function renderDocs(el) {

  const cur = docs.find(d => d.id === sel);
  el.querySelector("[data-d='wall']").disabled = !cur;

const LEVELS = [
  { name: "Débutant", rows: 9, cols: 9, mines: 10 },
  { name: "Intermédiaire", rows: 16, cols: 16, mines: 40 },
  { name: "Expert", rows: 16, cols: 30, mines: 99 }
];
const SEG = { 0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc", 5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg", "-": "g" };
function ledDigit(ch) {
  const on = SEG[ch] || "", P = {
    a: "M2 1h9l-2 2H4z", b: "M11.5 1.5v9l-2-1.5V3.5z", c: "M11.5 12.5v9l-2-2v-6z", d: "M2 22h9l-2-2H4z",
    e: "M1.5 12.5v9l2-2v-6z", f: "M1.5 1.5v9l2-1.5V3.5z", g: "M2 11.5l2-1.3h5l2 1.3-2 1.3H4z" };
  return `<svg viewBox="0 0 13 23">${Object.entries(P).map(([k, d]) => `<path d="${d}" fill="${on.includes(k) ? "#ff0000" : "#3a0000"}"/>`).join("")}</svg>`;
}
const led = n => { n = Math.max(-99, Math.min(999, n)); const t = n < 0 ? "-" + String(-n).padStart(2, "0") : String(n).padStart(3, "0"); return [...t].map(ledDigit).join(""); };
function faceSvg(mood) {
  const eyes = mood === "dead" ? `<path d="M5 5l2 2M7 5l-2 2M10 5l2 2M12 5l-2 2" stroke="#000" stroke-width="1"/>`
    : mood === "cool" ? `<path d="M3 6h11v1h-1l-1 2H9.5L9 7H8l-.5 2H5L4 7H3z" fill="#000"/>`
    : `<rect x="5" y="5" width="2" height="2" fill="#000"/><rect x="10" y="5" width="2" height="2" fill="#000"/>`;
  const mouth = mood === "oh" ? `<ellipse cx="8.5" cy="12" rx="1.6" ry="2" fill="none" stroke="#000"/>`
    : mood === "dead" ? `<path d="M5.5 13.5q3-3 6 0" fill="none" stroke="#000"/>`
    : `<path d="M5.5 11q3 3 6 0" fill="none" stroke="#000"/>`;
  return `<svg viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="7.5" fill="#ffff00" stroke="#000"/>${eyes}${mouth}</svg>`;
}
const FLAG = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges"><path d="M2 10h8v1H2zM4 9h4v1H4zM6 2h1v7H6z"/><path d="M6 1v5L2 3.5z" fill="#f00"/></svg>')}")`;

      <button class="mbtn" type="button" data-mm aria-haspopup="menu" aria-expanded="false"><u>G</u>ame</button>

        <button type="button" role="menuitem" data-ms="new"><span></span><span>Nouvelle partie</span><kbd>F2</kbd></button><hr>
        ${LEVELS.map((L, i) => `<button type="button" role="menuitemradio" data-ms="lvl" data-l="${i}"><span class="ck"></span><span>${L.name}</span><span></span></button>`).join("")}<hr>
        <button type="button" role="menuitem" data-ms="best"><span></span><span>Meilleurs temps…</span><span></span></button><hr>
        <button type="button" role="menuitem" data-ms="quit"><span></span><span>Quitter</span><span></span></button>

function initMines(el) {
  const $m = s => el.querySelector(s), grid = $m(".grid"), face = $m(".face"), ms = $m(".ms"), drop = $m(".drop"), mbtn = $m("[data-mm]"), panel = $m(".mspanel");
  ms.style.setProperty("--flag", FLAG); ms.style.setProperty("--mine", `url("${ICON.mine16}")`);
  const BEST = "h97-mines-best";
  const best = () => { try { return JSON.parse(localStorage.getItem(BEST)) || {}; } catch { return {}; } };
  let lvl = Math.min(2, Math.max(0, +LS.get("h97-mines-level") || 0));
  let R, C, M, mine, open, flag, cnt, state, opened, flags, t0, timer, secs, pressed = null;

  const N = i => { const r = Math.floor(i / C), c = i % C, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(rr * C + cc); }
    return out; };
  const setFace = m => { face.innerHTML = faceSvg(m); };
  const setLeft = () => { $m("[data-led=left]").innerHTML = led(M - flags); };
  const setTime = () => { $m("[data-led=time]").innerHTML = led(secs); };

  function newGame(l = lvl) {
    lvl = l; LS.set("h97-mines-level", String(l));
    ({ rows: R, cols: C, mines: M } = LEVELS[l]);
    mine = new Uint8Array(R * C); open = new Uint8Array(R * C); flag = new Uint8Array(R * C); cnt = new Uint8Array(R * C);
    state = "ready"; opened = 0; flags = 0; secs = 0; clearInterval(timer);
    ms.className = "ms l" + l; grid.style.setProperty("--cols", C);
    grid.innerHTML = Array.from({ length: R * C }, (_, i) => `<div class="cell" data-i="${i}" role="gridcell"></div>`).join("");
    drop.querySelectorAll("[data-ms=lvl]").forEach(b => { b.querySelector(".ck").textContent = +b.dataset.l === l ? "✓" : ""; b.setAttribute("aria-checked", String(+b.dataset.l === l)); });
    setFace("smile"); setLeft(); setTime(); place();
  }
  function place() { // recentre la fenêtre quand sa taille change
    if (el.classList.contains("max")) return;
    const W = innerWidth, H = innerHeight - 30, w = el.offsetWidth, h = el.offsetHeight;
    if (el.dataset.placed) { el.style.left = Math.max(2, Math.min(el.offsetLeft, W - w - 2)) + "px"; el.style.top = Math.max(2, Math.min(el.offsetTop, H - h - 2)) + "px"; return; }
    el.dataset.placed = "1"; el.style.left = Math.max(2, (W - w) / 2) + "px"; el.style.top = Math.max(2, (H - h) / 2 - 20) + "px";
  }
  function lay(safe) {
    const banned = new Set([safe, ...N(safe)]), free = [];
    for (let i = 0; i < R * C; i++) if (!banned.has(i)) free.push(i);
    for (let k = 0; k < M; k++) { const j = k + Math.floor(Math.random() * (free.length - k)); [free[k], free[j]] = [free[j], free[k]]; mine[free[k]] = 1; }
    for (let i = 0; i < R * C; i++) cnt[i] = N(i).reduce((s, j) => s + mine[j], 0);
    state = "play"; t0 = Date.now(); secs = 1; setTime();
    timer = setInterval(() => { secs = Math.min(999, Math.floor((Date.now() - t0) / 1000) + 1); setTime(); }, 250);
  }
  const cellEl = i => grid.children[i];
  function paintCell(i) {
    const e = cellEl(i); e.className = "cell"; e.textContent = "";
    if (open[i]) { e.classList.add("open"); if (cnt[i]) { e.textContent = cnt[i]; e.classList.add("n" + cnt[i]); } }
    else if (flag[i]) e.classList.add("flag");
  }
  function reveal(i) {
    if (open[i] || flag[i]) return;
    if (mine[i]) return lose(i);
    const stack = [i];
    while (stack.length) {
      const k = stack.pop(); if (open[k] || flag[k]) continue;
      open[k] = 1; opened++; paintCell(k);
      if (!cnt[k]) N(k).forEach(j => { if (!open[j] && !mine[j]) stack.push(j); });
    }
    if (opened === R * C - M) win();
  }
  function chord(i) {
    if (!open[i] || !cnt[i]) return;
    const nb = N(i); if (nb.reduce((s, j) => s + flag[j], 0) !== cnt[i]) return;
    for (const j of nb) { if (state !== "play") break; if (!flag[j] && !open[j]) reveal(j); }
  }
  function toggleFlag(i) {
    if (open[i] || state === "over" || state === "won") return;
    flag[i] ^= 1; flags += flag[i] ? 1 : -1; paintCell(i); setLeft();
  }
  function lose(i) {
    state = "over"; clearInterval(timer); setFace("dead");
    for (let k = 0; k < R * C; k++) {
      const e = cellEl(k);
      if (mine[k] && !flag[k]) { e.className = "cell open mine"; e.textContent = ""; }
      else if (!mine[k] && flag[k]) { e.className = "cell open wrong"; e.textContent = ""; }
    }
    cellEl(i).classList.add("boom");
  }
  function win() {
    state = "won"; clearInterval(timer); setFace("cool");
    for (let k = 0; k < R * C; k++) if (mine[k] && !flag[k]) { flag[k] = 1; paintCell(k); }
    flags = M; setLeft();
    const b = best(), key = LEVELS[lvl].name;
    if (!b[key] || secs < b[key].t) askName(key, secs);
  }
  function askName(key, t) {
    panel.firstElementChild.innerHTML = `<h4>Nouveau record en niveau ${key} : ${t} s</h4><label for="msName">Ton nom :</label><input type="text" id="msName" maxlength="20" value="${esc(LS.get("h97-mines-name") || "Anonyme")}"><div class="btns"><button class="btn default" type="button" data-p="save">OK</button></div>`;
    panel.hidden = false; const inp = panel.querySelector("#msName"); inp.select();
    const save = () => { const n = inp.value.trim() || "Anonyme"; LS.set("h97-mines-name", n); const b = best(); b[key] = { t, n }; try { localStorage.setItem(BEST, JSON.stringify(b)); } catch {} showBest(); };
    panel.querySelector("[data-p=save]").onclick = save; inp.onkeydown = e => { if (e.key === "Enter") save(); };
  }
  function showBest() {
    const b = best();
    panel.firstElementChild.innerHTML = `<h4>Meilleurs temps</h4><table>${LEVELS.map(L => `<tr><td>${L.name} :</td><td>${b[L.name] ? b[L.name].t + " s" : "999 s"}</td><td>${b[L.name] ? esc(b[L.name].n) : "Anonyme"}</td></tr>`).join("")}</table>
      <div class="btns"><button class="btn" type="button" data-p="reset">Réinitialiser</button><button class="btn default" type="button" data-p="ok">OK</button></div>`;
    panel.hidden = false;
    panel.querySelector("[data-p=ok]").onclick = () => { panel.hidden = true; };
    panel.querySelector("[data-p=reset]").onclick = () => { try { localStorage.removeItem(BEST); } catch {} showBest(); };
  }

  /* souris et doigt */
  let lp = null, lpDone = false, both = false, downBtns = 0;
  const idx = e => { const c = e.target.closest(".cell"); return c ? +c.dataset.i : -1; };
  const press = i => { unpress(); if (i < 0 || state === "over" || state === "won") return; const list = (both || (open[i] && cnt[i])) ? [i, ...N(i)] : [i]; pressed = list.filter(k => !open[k] && !flag[k]); pressed.forEach(k => cellEl(k).classList.add("down")); setFace("oh"); };
  const unpress = () => { if (pressed) pressed.forEach(k => cellEl(k).classList.remove("down")); pressed = null; };
  grid.addEventListener("contextmenu", e => e.preventDefault());
  grid.addEventListener("pointerdown", e => {
    if (state === "over" || state === "won") return;
    const i = idx(e); if (i < 0) return;
    downBtns = e.buttons; both = (e.buttons & 3) === 3 || e.button === 1;
    if (e.pointerType === "mouse" && e.button === 2 && !(e.buttons & 1)) { toggleFlag(i); return; }
    if (e.pointerType !== "mouse") { lpDone = false; clearTimeout(lp); lp = setTimeout(() => { lpDone = true; unpress(); setFace("smile"); toggleFlag(i); if (navigator.vibrate) navigator.vibrate(30); }, 380); }
    try { e.target.releasePointerCapture(e.pointerId); } catch {}
    press(i);
  });
  grid.addEventListener("pointerover", e => { if (pressed && e.buttons) press(idx(e)); });
  grid.addEventListener("pointerleave", () => { unpress(); clearTimeout(lp); if (state === "ready" || state === "play") setFace("smile"); });
  grid.addEventListener("pointercancel", () => { unpress(); clearTimeout(lp); setFace("smile"); });
  grid.addEventListener("pointerup", e => {
    clearTimeout(lp);
    const i = idx(e), wasBoth = both || (downBtns & 3) === 3; both = false;
    if (!pressed) { if (state !== "over" && state !== "won") setFace("smile"); return; }
    unpress(); if (state === "ready" || state === "play") setFace("smile");
    if (i < 0 || lpDone) return;
    if (e.pointerType === "mouse" && e.button === 2 && !wasBoth) return;
    if (state === "ready") { if (flag[i]) return; lay(i); }
    if (wasBoth || open[i]) chord(i); else reveal(i);
  });
  face.addEventListener("click", () => newGame());

  /* menu Game */
  const closeDrop = () => { drop.hidden = true; mbtn.setAttribute("aria-expanded", "false"); };
  mbtn.addEventListener("click", () => { const o = drop.hidden; drop.hidden = !o; mbtn.setAttribute("aria-expanded", String(o)); });
  document.addEventListener("pointerdown", e => { if (!drop.hidden && !drop.contains(e.target) && e.target !== mbtn) closeDrop(); });
  drop.addEventListener("click", e => {
    const b = e.target.closest("[data-ms]"); if (!b) return; closeDrop();
    if (b.dataset.ms === "new") newGame();
    else if (b.dataset.ms === "lvl") newGame(+b.dataset.l);
    else if (b.dataset.ms === "best") showBest();
    else if (b.dataset.ms === "quit") closeWin("mines");
  });
  el._keys = e => { if (e.key === "F2") { e.preventDefault(); newGame(); } };
  newGame();
}
document.addEventListener("keydown", e => { const w = wins.mines; if (w && w.el.classList.contains("active") && !w.el.hidden && w.el._keys) w.el._keys(e); });

}
function renderWallList(el) {
  const list = el.querySelector("#wpList"); if (!list) return;
  const p = el._pending, docs = allDocs();
  if (p.id && !docs.some(d => d.id === p.id)) p.id = "";
  list.innerHTML = `<button type="button" role="option" data-wp="" aria-selected="${!p.id}">(Aucun)</button>` +
    docs.map(d => `<button type="button" role="option" data-wp="${d.id}" aria-selected="${d.id === p.id}"><img data-icon="img" alt="">${esc(d.name)}</button>`).join("");
  fillIcons(list);
  el.querySelector("#wpMode").value = p.mode; el.querySelector("#wpMode").disabled = !p.id;
  const scr = el.querySelector("#pvScreen"); paint(scr, p);
  if (p.mode === "center" && p.id) scr.style.backgroundSize = "18%"; // l’aperçu est 5 fois plus petit que l’écran
  if (p.mode === "tile") scr.style.backgroundSize = "";
  el.querySelectorAll(".sw").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c.toLowerCase() === (p.color || "#008080").toLowerCase())));
  el.querySelector("#wpOther").value = p.color || "#008080";
  el.querySelector("[data-w='apply']").disabled = p.id === wallpaper.id && p.mode === wallpaper.mode && (p.color || "#008080") === (wallpaper.color || "#008080");
  const s = list.querySelector("[aria-selected='true']"); if (s) s.scrollIntoView({ block: "nearest" });
}

function initSettings(el, opts = {}) {
  const q = s => el.querySelector(s);
  el._pending = { ...wallpaper };
  el.querySelector(".tabs").addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) selectSettingsTab(el, t.dataset.tab); });
  q("#wpList").addEventListener("click", e => {
    const b = e.target.closest("[data-wp]"); if (!b) return;
    const d = allDocs().find(x => x.id === b.dataset.wp);
    el._pending = { color: el._pending && el._pending.color, id: b.dataset.wp, mode: d ? (el._pending.id ? el._pending.mode : d.mode) : el._pending.mode };
    if (d && d.builtin) el._pending.mode = d.mode;
    renderWallList(el);
  });
  q("#wpList").addEventListener("keydown", e => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return; e.preventDefault();
    const ids = ["", ...allDocs().map(d => d.id)], i = ids.indexOf(el._pending.id), n = ids[Math.max(0, Math.min(ids.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
    const d = allDocs().find(x => x.id === n); el._pending = { color: el._pending && el._pending.color, id: n, mode: d ? d.mode : el._pending.mode }; renderWallList(el);
  });
  q("#wpMode").addEventListener("change", e => { el._pending.mode = e.target.value; renderWallList(el); });
  const pickColor = c => { const p = el._pending; p.color = c; if (p.id && p.mode !== "center") p.id = ""; renderWallList(el); };
  q(".sws").addEventListener("click", e => { const b = e.target.closest(".sw"); if (b) pickColor(b.dataset.c); });
  q("#wpOtherBtn").addEventListener("click", () => q("#wpOther").click());
  q("#wpOther").addEventListener("input", e => pickColor(e.target.value));
  q("#wpBrowse").addEventListener("click", () => pickFiles(async fl => {
    const before = new Set(userImgs.map(x => x.id)); await importImages(fl);
    const added = userImgs.find(x => !before.has(x.id)); if (added) { el._pending = { color: el._pending && el._pending.color, id: added.id, mode: "fill" }; renderWallList(el); }
  }));
  q("[data-w='ok']").addEventListener("click", () => { setWallpaper(el._pending); closeWin("settings"); });
  q("[data-w='cancel']").addEventListener("click", () => closeWin("settings"));
  q("[data-w='apply']").addEventListener("click", () => { setWallpaper(el._pending); renderWallList(el); });
  renderWallList(el);
  if (opts.tab) selectSettingsTab(el, opts.tab, opts);

  q("#sUrl").value = LS.get("mv-sb-url"); q("#sKey").value = LS.get("mv-sb-key"); q("#tKey").value = LS.get("videotheque.tmdbkey");
  const say = (id, msg, kind = "") => { const s = q(id); s.textContent = msg; s.className = "status " + kind; };

  q("#sSave").addEventListener("click", async () => {
    const url = q("#sUrl").value.trim().replace(/\/+$/, ""), key = q("#sKey").value.trim();
    if (!url && !key) { LS.set("mv-sb-url", ""); LS.set("mv-sb-key", ""); sbClient = null; sbUser = null; renderAcct(el); reloadApp("vinyls"); return say("#sStatus", "Synchronisation désactivée sur ce site."); }
    if (/supabase\.com\/dashboard/.test(url)) return say("#sStatus", "C’est l’adresse du tableau de bord. Colle plutôt la « Project URL » (Project Settings, puis Data API), du type https://abcd1234.supabase.co.", "err");
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url) && !/^https:\/\/\S+$/.test(url)) return say("#sStatus", "L’adresse du projet doit commencer par https:// (par exemple https://abcd1234.supabase.co).", "err");
    if (key.length < 20) return say("#sStatus", "Colle la clé publique complète du projet.", "err");
    if (/^sb_secret_/.test(key) || /service_role/.test(key)) return say("#sStatus", "C’est la clé secrète : colle plutôt la clé « anon » ou « publishable ».", "err");
    LS.set("mv-sb-url", url); LS.set("mv-sb-key", key); sbClient = null;
    say("#sStatus", "Réglages enregistrés. Vérification…");
    await connect(); renderAcct(el); reloadApp("vinyls");
    say("#sStatus", sbClient ? "Serveur trouvé." : "Supabase ne répond pas : vérifie l’adresse et ta connexion.", sbClient ? "ok" : "err");
  });

  q("#tSave").addEventListener("click", async () => {
    const k = q("#tKey").value.trim(); LS.set("videotheque.tmdbkey", k); reloadApp("films");
    if (!k) return say("#tStatus", "Clé supprimée.");
    say("#tStatus", "Vérification…");
    try {
      const u = new URL("https://api.themoviedb.org/3/configuration"), h = { accept: "application/json" };
      if (k.length > 40) h.Authorization = "Bearer " + k; else u.searchParams.set("api_key", k);
      const r = await fetch(u, { headers: h });
      say("#tStatus", r.ok ? "Clé enregistrée et valide." : "Clé enregistrée, mais TMDB la refuse. Vérifie-la.", r.ok ? "ok" : "err");
    } catch { say("#tStatus", "Clé enregistrée. TMDB n’a pas répondu pour la vérifier.", ""); }
  });

  q("#acct").addEventListener("click", async e => {
    const b = e.target.closest("[data-acct]"); if (!b) return;
    if (b.dataset.acct === "out") {
      try { await sbClient.auth.signOut(); } catch {}
      sbUser = null; renderAcct(el); reloadApp("vinyls"); setNet(); return say("#sStatus", "Déconnecté.");
    }
    const email = q("#aMail").value.trim(), password = q("#aPass").value;
    if (!email || !password) return say("#sStatus", "Saisis ton adresse e-mail et ton mot de passe.", "err");
    if (!sbClient) await connect();
    if (!sbClient) return say("#sStatus", "Enregistre d’abord l’adresse et la clé du serveur.", "err");
    say("#sStatus", "Connexion…");
    let res;
    try { res = await sbClient.auth.signInWithPassword({ email, password }); } catch (err) { res = { error: err }; }
    const error = res.error;
    if (error) {
      const m = String(error.message || error);
      return say("#sStatus", /invalid login/i.test(m) ? "E-mail ou mot de passe incorrect."
        : /failed to fetch|network|load failed/i.test(m) ? "Impossible de joindre le serveur Supabase : vérifie l’adresse du projet, que le projet n’est pas en pause, et qu’aucune extension ne bloque supabase.co."
        : /email not confirmed/i.test(m) ? "Ton adresse n’est pas encore confirmée : clique sur le lien reçu par e-mail." : m, "err");
    }
    sbUser = res.data.user; renderAcct(el); reloadApp("vinyls"); setNet();
    say("#sStatus", "Connecté : ta collection de vinyles va se synchroniser.", "ok");
  });

  renderAcct(el);
  connect().then(() => renderAcct(el));
}

function renderAcct(el) {
  const box = el && el.querySelector("#acct"); if (!box) return;
  if (!LS.get("mv-sb-url") || !LS.get("mv-sb-key")) { box.innerHTML = `<p class="hint">Enregistre d’abord l’adresse et la clé du serveur.</p>`; return; }
  if (sbUser) {
    box.innerHTML = `<div class="who"><img data-icon="vinyl" alt=""><span>Connecté en tant que<br><b>${esc(sbUser.email || "")}</b></span></div>
      <div class="btns"><button class="btn" type="button" data-acct="out">Se déconnecter</button></div>`;
    fillIcons(box);
  } else {
    box.innerHTML = `<div class="row"><label for="aMail">E-mail</label><input type="email" id="aMail" autocomplete="username"></div>
      <div class="row"><label for="aPass">Mot de passe</label><input type="password" id="aPass" autocomplete="current-password"></div>
      <div class="btns"><button class="btn default" type="button" data-acct="in">Se connecter</button></div>`;
    box.querySelector("#aPass").addEventListener("keydown", e => { if (e.key === "Enter") box.querySelector("[data-acct='in']").click(); });
  }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function loadSupabase() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function connect() {
  const url = LS.get("mv-sb-url"), key = LS.get("mv-sb-key");
  if (!url || !key) { sbClient = null; sbUser = null; setNet(); return; }
  try {
    await loadSupabase();
    if (!sbClient) sbClient = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: "mv-sb-auth" } });
    const { data } = await sbClient.auth.getSession();
    sbUser = data && data.session ? data.session.user : null;
  } catch { sbClient = null; sbUser = null; }
  setNet();
}
function setNet() {
  const i = $("#netIcon"); i.src = netIcon(!!sbUser);
  i.title = sbUser ? `Vinyls : connecté (${sbUser.email || ""})` : "Vinyls : non connecté";
}
function reloadApp(id) { const w = wins[id]; if (w) { const f = w.el.querySelector("iframe"); f.src = f.src; } }

/* Le site de vinyles peut aussi se connecter de lui-même : on suit la session partagée. */
addEventListener("storage", e => { if (e.key === "mv-sb-auth" || e.key === "mv-sb-url" || e.key === "mv-sb-key") { sbClient = null; connect().then(() => wins.settings && renderAcct(wins.settings.el)); } });
if (LS.get("mv-sb-url")) connect();
loadDocs().then(() => paint($("#desktop"), wallpaper));
})();
</script>
</body>
